# Stack SID expo. Jalankan lewat skrip (deploy/scripts/*.sh), bukan langsung:
# skrip mengatur -p, --env-file compose.env, SID_IMAGE_TAG, SID_ENV_FILE, COMPOSE_PROFILES.
#   Mode DB local : SID_ENV_FILE=<config>/sid.env       COMPOSE_PROFILES=localdb
#   Mode DB neon  : SID_ENV_FILE=<config>/sid.neon.env  COMPOSE_PROFILES=(kosong)
# Perintah compose manual: bash deploy/scripts/lib.sh <argumen docker compose>

name: sid

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  sid_db:
    image: postgres:18.6-trixie
    container_name: ${SID_PROJECT:-sid}_db
    profiles: ["localdb"]
    restart: unless-stopped
    env_file:
      - ${SID_ENV_FILE:-sid.env}
    command:
      - postgres
      - -c
      - timezone=Asia/Jakarta
      - -c
      - log_timezone=Asia/Jakarta
    volumes:
      # PostgreSQL 18+: VOLUME di /var/lib/postgresql (PGDATA=/var/lib/postgresql/18/docker).
      - pgdata:/var/lib/postgresql
    networks:
      - sid_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    stop_grace_period: 30s
    logging: *logging

  sid_api:
    image: ${SID_REGISTRY:?SID_REGISTRY wajib diisi di compose.env}/sid-api:${SID_IMAGE_TAG:?SID_IMAGE_TAG wajib diisi (mis. v1.2.3)}
    container_name: ${SID_PROJECT:-sid}_api
    restart: unless-stopped
    env_file:
      - ${SID_ENV_FILE:-sid.env}
    volumes:
      - public:/var/www/html/storage/app/public
      - private:/var/www/html/storage/app/private
    networks:
      - sid_net
      # Keluar internet (DB Neon pada mode neon). Tanpa port ke host.
      - sid_egress
    depends_on:
      sid_db:
        condition: service_healthy
        required: false
    # Healthcheck (ping FPM via cgi-fcgi) didefinisikan di Dockerfile sid-api.
    stop_grace_period: 20s
    logging: *logging

  # Scheduler Laravel (pengingat approval UC-22, approvals:send-reminders).
  # Image & env sama dengan sid_api; entrypoint menjalankannya sebagai www-data.
  sid_scheduler:
    image: ${SID_REGISTRY:?SID_REGISTRY wajib diisi di compose.env}/sid-api:${SID_IMAGE_TAG:?SID_IMAGE_TAG wajib diisi (mis. v1.2.3)}
    container_name: ${SID_PROJECT:-sid}_scheduler
    restart: unless-stopped
    command: ["php", "artisan", "schedule:work"]
    env_file:
      - ${SID_ENV_FILE:-sid.env}
    volumes:
      - public:/var/www/html/storage/app/public
      - private:/var/www/html/storage/app/private
    networks:
      - sid_net
      # Keluar internet (DB Neon pada mode neon). Web push hanya diantrekan;
      # pengirimnya sid_worker.
      - sid_egress
    depends_on:
      sid_api:
        condition: service_healthy
    # Healthcheck image (ping PHP-FPM) tidak berlaku untuk proses scheduler.
    healthcheck:
      disable: true
    stop_grace_period: 20s
    logging: *logging

  # Queue worker (QUEUE_CONNECTION=database): mengirim Web Push dari tabel jobs.
  # Notifikasi in-app tetap sinkron, jadi worker mati hanya menunda push.
  # --max-time: worker keluar tiap jam lalu dinyalakan ulang Docker (memori bersih).
  sid_worker:
    image: ${SID_REGISTRY:?SID_REGISTRY wajib diisi di compose.env}/sid-api:${SID_IMAGE_TAG:?SID_IMAGE_TAG wajib diisi (mis. v1.2.3)}
    container_name: ${SID_PROJECT:-sid}_worker
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "--tries=3", "--backoff=30", "--sleep=3", "--max-time=3600"]
    env_file:
      - ${SID_ENV_FILE:-sid.env}
    volumes:
      - public:/var/www/html/storage/app/public
      - private:/var/www/html/storage/app/private
    networks:
      - sid_net
      # Web push dikirim ke layanan push browser di internet.
      - sid_egress
    depends_on:
      sid_api:
        condition: service_healthy
    # Healthcheck image (ping PHP-FPM) tidak berlaku untuk proses worker.
    healthcheck:
      disable: true
    # SIGTERM: queue:work menyelesaikan job yang sedang jalan dulu.
    stop_grace_period: 30s
    logging: *logging

  sid_web:
    image: ${SID_REGISTRY:?SID_REGISTRY wajib diisi di compose.env}/sid-web:${SID_IMAGE_TAG:?SID_IMAGE_TAG wajib diisi (mis. v1.2.3)}
    container_name: ${SID_PROJECT:-sid}_web
    restart: unless-stopped
    ports:
      # Satu-satunya port host, hanya loopback (proxy/tunnel tim di host).
      # Hindari 8000, 8080, 3307, 6379 (CiMart).
      - "127.0.0.1:${SID_HTTP_PORT:-8100}:80"
    volumes:
      - public:/var/www/html/storage/app/public:ro
    networks:
      - sid_net
      - sid_egress
    depends_on:
      sid_api:
        condition: service_healthy
    # Healthcheck (wget /healthz) didefinisikan di Dockerfile sid-web.
    logging: *logging

networks:
  sid_net:
    internal: true
  # Jaringan biasa: port publish sid_web dan egress sid_api tidak berfungsi di jaringan internal.
  sid_egress: {}

volumes:
  pgdata:
  public:
  private:
