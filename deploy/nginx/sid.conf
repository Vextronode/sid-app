# Nginx sid-web: satu origin untuk SPA + proxy ke PHP-FPM (sid_api:9000).
# Dipasang sebagai /etc/nginx/conf.d/sid.conf (konteks http). TLS diakhiri proxy tim.

# HTTPS=on untuk PHP bila proxy tim meneruskan X-Forwarded-Proto: https.
map $http_x_forwarded_proto $sid_https {
    default "";
    https   on;
}

map $http_x_forwarded_proto $sid_scheme {
    default $scheme;
    https   https;
}

# Path auth non-/api: GET/HEAD -> SPA, method lain -> PHP.
map $request_method $sid_is_read {
    default 0;
    GET     1;
    HEAD    1;
}

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    absolute_redirect off;

    # >= post_max_size PHP (24M).
    client_max_body_size 25m;

    # DNS Docker; nama upstream lewat variabel supaya Nginx tetap start
    # walau sid_api belum ada (request ke PHP menjadi 502, bukan crash).
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    set $sid_api sid_api:9000;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json
               application/manifest+json image/svg+xml application/xml;

    # ---- Parameter FastCGI (diwarisi semua location yang memakai fastcgi_pass) ----
    # Kode PHP hanya ada di sid_api; Nginx selalu menunjuk front controller.
    fastcgi_param QUERY_STRING      $query_string;
    fastcgi_param REQUEST_METHOD    $request_method;
    fastcgi_param CONTENT_TYPE      $content_type;
    fastcgi_param CONTENT_LENGTH    $content_length;
    fastcgi_param SCRIPT_FILENAME   /var/www/html/public/index.php;
    fastcgi_param SCRIPT_NAME       /index.php;
    fastcgi_param DOCUMENT_URI      /index.php;
    fastcgi_param DOCUMENT_ROOT     /var/www/html/public;
    fastcgi_param REQUEST_URI       $request_uri;
    fastcgi_param SERVER_PROTOCOL   $server_protocol;
    fastcgi_param REQUEST_SCHEME    $sid_scheme;
    fastcgi_param HTTPS             $sid_https if_not_empty;
    fastcgi_param GATEWAY_INTERFACE CGI/1.1;
    fastcgi_param SERVER_SOFTWARE   nginx;
    fastcgi_param REMOTE_ADDR       $remote_addr;
    fastcgi_param REMOTE_PORT       $remote_port;
    fastcgi_param SERVER_ADDR       $server_addr;
    fastcgi_param SERVER_PORT       $server_port;
    fastcgi_param SERVER_NAME       $host;
    fastcgi_param REDIRECT_STATUS   200;
    # Mitigasi httpoxy. Header lain (X-Forwarded-For/Proto/Host dari proxy tim)
    # diteruskan apa adanya sebagai HTTP_*; tidak ditimpa.
    fastcgi_param HTTP_PROXY        "";

    fastcgi_connect_timeout 5s;
    fastcgi_send_timeout 120s;
    fastcgi_read_timeout 120s;
    fastcgi_buffer_size 32k;
    fastcgi_buffers 16 16k;

    # ---- Health ----
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ---- Backend Laravel ----
    location = /up {
        fastcgi_pass $sid_api;
    }

    location ^~ /api/ {
        fastcgi_pass $sid_api;
    }

    location ^~ /sanctum/ {
        fastcgi_pass $sid_api;
    }

    # Tautan verifikasi email (GET bertanda tangan); tidak ada rute SPA di sini.
    location ^~ /verify-email/ {
        fastcgi_pass $sid_api;
    }

    location @php {
        fastcgi_pass $sid_api;
    }

    # ---- File publik (disk `public`), dilayani langsung dari volume, tidak ke PHP ----
    location ^~ /storage/ {
        alias /var/www/html/storage/app/public/;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600";

        location ~ /\. {
            return 404;
        }
    }

    # ---- Aset build Vite ----
    location ^~ /assets/ {
        # Tanpa fallback ke index.html: aset lama yang hilang harus 404.
        try_files $uri =404;
        # Ikon/gambar di /assets/icons, /assets/image tidak ber-hash.
        add_header Cache-Control "public, max-age=86400";

        # Worker PDF.js (.mjs) wajib bertipe JavaScript.
        location ~ ^/assets/[^/]+\.mjs$ {
            types { }
            default_type text/javascript;
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Berkas langsung di /assets/ adalah keluaran Vite ber-hash.
        location ~ ^/assets/[^/]+\.(?:js|css|woff2?)$ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }

    # ---- Berkas PWA: selalu revalidasi agar pembaruan terdeteksi ----
    location = /index.html {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    location = /sw.js {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    location = /registerSW.js {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    location = /push-handler.js {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    # ---- Tolak dotfile ----
    location ~ /\. {
        return 404;
    }

    location ~ ^/workbox-[^/]+\.js$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    # ---- Path auth Laravel di luar /api ----
    # POST dsb. -> PHP; GET/HEAD -> SPA (mis. /register juga rute SPA).
    location ~ ^/(?:login|logout|register|forgot-password|reset-password|email/verification-notification)$ {
        error_page 418 = @php;
        if ($sid_is_read = 0) {
            return 418;
        }
        try_files $uri /index.html;
    }

    # ---- SPA (BrowserRouter tanpa basename) ----
    location / {
        try_files $uri $uri/ /index.html;
    }
}
