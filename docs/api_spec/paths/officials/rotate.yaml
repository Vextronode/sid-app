post:
  tags: [Epic 2 - Users, Citizens, Officials]
  summary: Rotasi pejabat ke pengganti (akun warga atau data warga)
  description: |
    Hanya Petugas Desa. Demote pejabat lama lalu promote pengganti dalam
    satu transaksi dengan posisi dan wilayah yang sama. Jabatan berakun
    memakai `user_id`; jabatan tanpa akun memakai `citizen_id`. Foto
    pengganti wajib (multipart) dan disimpan sebelum transaksi, dihapus lagi
    bila rotasi gagal. Berlaku juga untuk staf aplikasi `staf_sid` (hanya
    satu per desa), termasuk staf yang menyerahkan jabatannya sendiri: ia
    langsung kembali menjadi warga, dan request berikutnya ke endpoint staf
    ditolak 403 `code: role_forbidden`. Respons memuat
    old_official, new_official, warnings (kosong). Setelah rotasi Kepala Desa,
    TTD jabatan diunggah ulang ke record baru.
  operationId: rotateOfficial
  security:
    - sanctumCookie: []
  parameters:
    - name: official
      in: path
      required: true
      description: ID record official yang sedang aktif (akan diakhiri jabatannya)
      schema:
        type: integer
      example: 5
  requestBody:
    required: true
    content:
      multipart/form-data:
        schema:
          $ref: '../../schemas/users/users.yaml#/RotateOfficialRequest'
  responses:
    '200':
      description: Rotasi jabatan berhasil diproses
      content:
        application/json:
          schema:
            $ref: '../../schemas/users/users.yaml#/RotateOfficialResponse'
    '401':
      $ref: '../../responses/common.yaml#/Unauthenticated'
    '403':
      $ref: '../../responses/common.yaml#/Forbidden'
    '404':
      description: Record official yang mau dirotasi tidak ditemukan
      content:
        application/json:
          schema:
            $ref: '../../schemas/common/errors.yaml#/NotFoundResponse'
    '422':
      description: Akun pengganti atau tanggal jabatan tidak valid
      content:
        application/json:
          schema:
            $ref: '../../schemas/common/errors.yaml#/ValidationErrorResponse'
          example:
            message: "The given data was invalid."
            errors:
              user_id: ["Akun target harus warga aktif yang belum menjabat dan terhubung ke data kependudukan."]
