post:
  tags: [Epic 2 - Users, Citizens, Officials]
  summary: Tetapkan pejabat (promote)
  description: |
    Aktor: Petugas Desa aktif. Jabatan berakun (enum OfficialPosition)
    ditetapkan ke akun warga (`user_id`) dan role akun diubah sesuai
    jabatan; jabatan tanpa akun (jenis jabatan desa aktif) ditetapkan ke data
    warga (`citizen_id`) tanpa mengubah role. Jabatan bertipe satu pemegang
    per wilayah ditolak 409 bila sudah terisi. Foto wajib. Bila jabatan RT
    ditetapkan, pejabat baru diberi notifikasi tentang surat yang tertahan
    di step RT wilayahnya. Tercatat di activity log `official`.
  operationId: promoteOfficial
  security:
    - sanctumCookie: []
  requestBody:
    required: true
    content:
      multipart/form-data:
        schema:
          $ref: '../../schemas/users/users.yaml#/PromoteOfficialRequest'
  responses:
    '201':
      description: Jabatan dibuat
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: '../../schemas/users/users.yaml#/Official'
    '401':
      $ref: '../../responses/common.yaml#/Unauthenticated'
    '403':
      description: Hanya Petugas Desa yang dapat menetapkan pejabat
    '409':
      description: Posisi tunggal pada wilayah tersebut sudah terisi
    '422':
      description: Posisi tidak dikenal, target tidak memenuhi syarat, wilayah beda desa, atau validasi foto gagal
