patch:
  tags: [Epic 1 - Struktur Wilayah]
  summary: Memperbarui RW
  description: Eksklusif Petugas Desa. Memperbarui data atau status aktif RW.
  operationId: updateRw
  security:
    - sanctumCookie: []
  parameters:
    - name: rw
      in: path
      required: true
      schema:
        type: integer
      example: 1
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            hamlet_id:
              type: integer
              example: 1
            number:
              type: string
              example: "002"
            is_active:
              type: boolean
              example: false
  responses:
    '200':
      description: RW berhasil diperbarui
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: '../../schemas/wilayah/wilayah.yaml#/Rw'
    '401':
      $ref: '../../responses/common.yaml#/Unauthenticated'
    '403':
      $ref: '../../responses/common.yaml#/Forbidden'
    '404':
      $ref: '../../responses/common.yaml#/NotFound'
    '409':
      $ref: '../../responses/common.yaml#/Conflict'
    '422':
      $ref: '../../responses/common.yaml#/ValidationError'
delete:
  tags: [Epic 1 - Struktur Wilayah]
  summary: Hapus RW
  description: Eksklusif Petugas Desa. Penghapusan ditolak bila RW masih memiliki warga aktif.
  operationId: deleteRw
  security:
    - sanctumCookie: []
  parameters:
    - name: rw
      in: path
      required: true
      schema:
        type: integer
      example: 1
  responses:
    '200':
      description: RW berhasil dihapus
      content:
        application/json:
          example:
            message: "RW berhasil dihapus."
    '401':
      $ref: '../../responses/common.yaml#/Unauthenticated'
    '403':
      $ref: '../../responses/common.yaml#/Forbidden'
    '404':
      $ref: '../../responses/common.yaml#/NotFound'
    '409':
      $ref: '../../responses/common.yaml#/Conflict'
