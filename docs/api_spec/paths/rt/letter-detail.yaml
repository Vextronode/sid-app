get:
  tags: [Epic 5 - Alur Pengajuan & Approval Surat]
  summary: Lihat detail surat untuk diperiksa RT
  operationId: getRtLetterDetail
  security:
    - sanctumCookie: []
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
      example: 501
  responses:
    '200':
      description: Detail surat berhasil diambil
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: '../../schemas/letters/letters.yaml#/LetterDetail'
    '401':
      $ref: '../../responses/common.yaml#/Unauthenticated'
    '403':
      description: Surat bukan wilayah RT yang login
      content:
        application/json:
          schema:
            $ref: '../../schemas/common/errors.yaml#/ForbiddenResponse'
          example:
            message: "Surat bukan wilayah Anda"
    '404':
      $ref: '../../responses/common.yaml#/NotFound'
