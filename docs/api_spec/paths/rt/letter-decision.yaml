patch:
  tags: [Epic 5 - Alur Pengajuan & Approval Surat]
  summary: Keputusan approve/reject RT (Tahap 1)
  description: |
    UC-04a. Aktor role `rt`. Gate: RT aktif dengan `rt_id` sama dengan
    `citizen.rt_id` pemohon, bukan pemohon sendiri, dan step aktif surat
    adalah `rt`. Di dalam transaksi surat dikunci (`lockForUpdate`) lalu
    status/step diperiksa ulang.

    - **Approve**: placeholder approval step RT diisi aktor/aksi; surat
      maju ke step actionable berikutnya (`in_progress`), placeholder
      ber-deadline dibuat untuk step itu. Notifikasi: FYI ke RW wilayah RW
      pemohon (`rt_approved_rw_fyi`), FYI ke Kadus dusun pemohon
      (`rt_approved_kadus_fyi`), approver berikutnya (`rt_approved`), dan
      pemohon (`rt_approved`).
    - **Reject**: `rejected`, `rejected_at_step` = step RT (terminal);
      notifikasi `rt_rejected` ke pemohon.
  operationId: decideRtLetter
  security:
    - sanctumCookie: []
  parameters:
    - name: letter
      in: path
      required: true
      schema:
        type: string
        format: uuid
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../schemas/letters/letters.yaml#/DecisionRequest'
  responses:
    '200':
      description: Keputusan tersimpan
      content:
        application/json:
          schema:
            $ref: '../../schemas/letters/letters.yaml#/DecisionResponse'
    '401':
      $ref: '../../responses/common.yaml#/Unauthenticated'
    '403':
      description: Bukan RT aktif, surat di luar wilayah RT, atau surat milik sendiri
      content:
        application/json:
          schema:
            $ref: '../../schemas/common/errors.yaml#/ForbiddenResponse'
    '404':
      $ref: '../../responses/common.yaml#/NotFound'
    '409':
      description: Surat tidak sedang di tahap RT atau sudah diproses
      content:
        application/json:
          schema:
            $ref: '../../schemas/common/errors.yaml#/ConflictResponse'
    '422':
      description: Reject tanpa catatan, atau tahap berikutnya tidak tersedia
      content:
        application/json:
          schema:
            $ref: '../../schemas/common/errors.yaml#/ValidationErrorResponse'
