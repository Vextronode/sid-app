get:
  tags: [Epic 6 - Sistem Notifikasi]
  summary: Lihat daftar notifikasi milik user yang login
  description: |
    Dipanggil setiap halaman dimuat (dashboard). Field universal
    (title, message, icon, color, category, read, time) selalu ada
    di top-level; field spesifik jenis notifikasi (mis. letter_id
    untuk surat) dibungkus di `context` - lihat schema `Notification`
    untuk detail.
  operationId: listNotifications
  security:
    - sanctumCookie: []
  parameters:
    - name: unread_only
      in: query
      required: false
      schema:
        type: boolean
      example: true
  responses:
    '200':
      description: Daftar notifikasi berhasil diambil
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  $ref: '../../schemas/notifications/notifications.yaml#/Notification'
          example:
            data:
              - id: "9c858901-8a57-4791-81fe-4c455b099bc9"
                type: "LetterStatusNotification"
                title: "Surat Disetujui RT"
                message: "Permohonan surat domisili Anda telah disetujui RT"
                category: "pelayanan"
                icon: "signature"
                color: "green"
                read: false
                created_at: "2026-07-01T09:00:00Z"
                time: "5 menit yang lalu"
                context:
                  letter_id: 501
                  letter_no: "470/123/VII/2026"
                  status: "rt_approved"
                  applicant: "Siti Aminah"
    '401':
      $ref: '../../responses/common.yaml#/Unauthenticated'
