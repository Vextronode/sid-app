get:
  tags: [Epic 6 - Sistem Notifikasi]
  summary: Lihat jumlah notifikasi yang belum dibaca milik user yang login
  description: |
    Dipakai untuk badge notifikasi. Mengembalikan integer murni, tidak
    ada entity yang perlu ditransformasi via Resource.
  operationId: getUnreadNotificationCount
  security:
    - sanctumCookie: []
  responses:
    '200':
      description: Jumlah notifikasi belum dibaca berhasil diambil
      content:
        application/json:
          schema:
            type: object
            properties:
              count:
                type: integer
                example: 3
    '401':
      $ref: '../../responses/common.yaml#/Unauthenticated'
