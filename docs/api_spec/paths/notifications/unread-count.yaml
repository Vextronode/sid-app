get:
  tags: [Epic 6 - Sistem Notifikasi]
  summary: Lihat jumlah notifikasi yang belum dibaca milik user yang login
  description: |
    Dipakai untuk badge notifikasi. Jumlah dibungkus `data` seperti
    respons agregat lain (`{ "data": { "count": 3 } }`).
  operationId: getUnreadNotificationCount
  security:
    - sanctumCookie: []
  responses:
    '200':
      description: Jumlah notifikasi belum dibaca berhasil diambil
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  count:
                    type: integer
                    example: 3
    '401':
      $ref: '../../responses/common.yaml#/Unauthenticated'
