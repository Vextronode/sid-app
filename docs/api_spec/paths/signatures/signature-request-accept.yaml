post:
  tags: [Epic 5 - Alur Pengajuan & Approval Surat]
  summary: Setujui permintaan saksi/persetujuan
  description: |
    Hanya pemilik NIK yang dituju dan selama permintaan masih pending.
    Kata sandi diminta ulang. Tidak ada TTD digital: persetujuan dicatat dan
    pemohon menerima notifikasi `signature_accepted`. Bila semua saksi surat
    lengkap, surat otomatis masuk step approval pertama.
  operationId: acceptSignatureRequest
  security:
    - sanctumCookie: []
  parameters:
    - name: signatureRequest
      in: path
      required: true
      description: ID baris `letter_signatures`.
      schema:
        type: integer
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required: [password]
          properties:
            password:
              type: string
              format: password
  responses:
    '200':
      description: Disetujui
      content:
        application/json:
          schema:
            $ref: '../../schemas/common/errors.yaml#/SuccessMessage'
          example:
            message: "Permintaan saksi disetujui."
    '401':
      $ref: '../../responses/common.yaml#/Unauthenticated'
    '404':
      description: Permintaan tidak ditujukan ke akun ini
    '409':
      description: Permintaan sudah tidak aktif
    '422':
      description: Kata sandi salah
