get:
  tags: [Epic 5 - Alur Pengajuan & Approval Surat]
  summary: Status tanda tangan pribadi akun
  description: |
    Lintas-role. Tanda tangan pribadi melekat ke akun (warga maupun pejabat),
    terpisah dari TTD jabatan Kepala Desa di `officials.signature_img`.
  operationId: showProfileSignature
  security:
    - sanctumCookie: []
  responses:
    '200':
      description: Status TTD
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: '../../schemas/letters/letters.yaml#/UserSignatureStatus'
    '401':
      $ref: '../../responses/common.yaml#/Unauthenticated'

post:
  tags: [Epic 5 - Alur Pengajuan & Approval Surat]
  summary: Buat tanda tangan pribadi (sekali)
  description: |
    Diisi sekali dan tidak dapat diubah sendiri; reset hanya oleh Petugas
    Desa (POST /users/{user}/signature/reset). Berkas dienkripsi
    (`Crypt::encryptString`) dan disimpan di disk privat
    `user-signatures/{user_id}/{uuid}.enc`.
  operationId: storeProfileSignature
  security:
    - sanctumCookie: []
  requestBody:
    required: true
    content:
      multipart/form-data:
        schema:
          type: object
          required: [signature]
          properties:
            signature:
              type: string
              format: binary
              description: PNG/JPG/JPEG, maks 512 KB.
  responses:
    '201':
      description: TTD tersimpan
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: "Tanda tangan berhasil disimpan."
              data:
                $ref: '../../schemas/letters/letters.yaml#/UserSignatureStatus'
    '401':
      $ref: '../../responses/common.yaml#/Unauthenticated'
    '409':
      description: Tanda tangan sudah tersimpan
    '422':
      $ref: '../../responses/common.yaml#/ValidationError'
