get:
  tags: [Epic 5 - Alur Pengajuan & Approval Surat]
  summary: Gambar tanda tangan pribadi akun sendiri
  description: |
    Didekripsi dari disk privat dan dikirim dengan `Cache-Control: private,
    no-store` serta `X-Content-Type-Options: nosniff`. Hanya pemilik akun.
  operationId: profileSignatureImage
  security:
    - sanctumCookie: []
  responses:
    '200':
      description: Gambar TTD
      content:
        image/png:
          schema:
            type: string
            format: binary
        image/jpeg:
          schema:
            type: string
            format: binary
    '401':
      $ref: '../../responses/common.yaml#/Unauthenticated'
    '404':
      description: Belum memiliki tanda tangan / berkas tidak terbaca
