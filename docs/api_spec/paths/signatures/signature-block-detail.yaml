delete:
  tags: [Epic 5 - Alur Pengajuan & Approval Surat]
  summary: Cabut blokir permintaan tanda tangan
  operationId: deleteSignatureBlock
  security:
    - sanctumCookie: []
  parameters:
    - name: signatureBlock
      in: path
      required: true
      schema:
        type: integer
  responses:
    '200':
      description: Blokir dicabut
      content:
        application/json:
          schema:
            $ref: '../../schemas/common/errors.yaml#/SuccessMessage'
          example:
            message: "Blokir dicabut."
    '401':
      $ref: '../../responses/common.yaml#/Unauthenticated'
    '404':
      description: Data blokir bukan milik akun ini
