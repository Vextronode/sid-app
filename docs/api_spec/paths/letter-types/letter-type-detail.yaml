put:
  tags: [Epic 4 - Konfigurasi Tipe Surat & Pipeline Approval]
  summary: Edit konfigurasi tipe surat (versi sederhana)
  description: |
    UC-21. Aktor: Petugas Desa. Hanya `validity_days`, `assigned_role`, dan
    `is_active` yang diterima. Flow, template, isian form, slot tanda tangan,
    aksi data, dan dokumen pendukung diset developer lewat seeder. Tipe surat
    dicari dalam desa Petugas yang login; milik desa lain menghasilkan 404.
  operationId: updateLetterType
  security:
    - sanctumCookie: []
  parameters:
    - name: letterType
      in: path
      required: true
      schema:
        type: integer
      example: 1
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../schemas/letter-types/letter-types.yaml#/LetterTypeUpdateRequest'
  responses:
    '200':
      description: Konfigurasi tipe surat berhasil diperbarui
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: '../../schemas/letter-types/letter-types.yaml#/LetterType'
    '401':
      $ref: '../../responses/common.yaml#/Unauthenticated'
    '403':
      $ref: '../../responses/common.yaml#/Forbidden'
    '404':
      $ref: '../../responses/common.yaml#/NotFound'
    '422':
      description: |
        validity_days < 1, assigned_role tidak valid, atau `is_active=true`
        untuk tipe Draft (template NULL): "Jenis surat draft belum memiliki
        template sehingga tidak dapat diaktifkan."
      content:
        application/json:
          schema:
            $ref: '../../schemas/common/errors.yaml#/ValidationErrorResponse'
          example:
            message: "Masa berlaku harus lebih dari 0 hari"
            errors:
              validity_days: ["Masa berlaku harus lebih dari 0 hari"]
