get:
  tags: [Epic 4 - Konfigurasi Tipe Surat & Pipeline Approval]
  summary: Lihat daftar tipe surat
  description: |
    Lintas-role (semua user login). Default: tipe surat milik desa akun yang
    login yang `template != NULL` dan `is_active = true`, urut nama (dipakai
    warga saat memilih jenis surat).

    `include_inactive=true` (khusus Staf SIDUTama / `staf_sid`): semua tipe
    surat desa termasuk Draft dan Nonaktif, urut nama, untuk halaman
    pengaturan (UC-21). Badge diturunkan dari `status_label`.
  operationId: listLetterTypes
  security:
    - sanctumCookie: []
  parameters:
    - name: include_inactive
      in: query
      required: false
      description: Sertakan tipe Draft dan Nonaktif. Selain `staf_sid` -> 403.
      schema:
        type: boolean
        default: false
  responses:
    '200':
      description: Daftar tipe surat berhasil diambil
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: "Daftar jenis surat berhasil diambil."
              data:
                type: array
                items:
                  $ref: '../../schemas/letter-types/letter-types.yaml#/LetterType'
          example:
            message: "Daftar jenis surat berhasil diambil."
            data:
              - id: 1
                code: "A01"
                name: "Surat Keterangan Usaha"
                template: "<div>...</div>"
                requirements_info: null
                flow_id: 1
                assigned_role: "kasi_pemerintahan"
                validity_days: 365
                is_active: true
                produces_letter: true
                data_action: "none"
                form_fields:
                  - { name: "nama_usaha", label: "Nama Usaha", type: "text", required: true }
                data_fields: []
                signature_slots: []
                has_supporting_document: false
                status_label: "aktif"
    '401':
      $ref: '../../responses/common.yaml#/Unauthenticated'
    '403':
      description: |
        Akun tidak aktif atau tidak memiliki desa, atau `include_inactive=true`
        dikirim oleh role selain `staf_sid` ("Hanya <label staf_sid> yang
        berwenang.", label dari `UserRole::stafSidLabel()`).
      content:
        application/json:
          schema:
            $ref: '../../schemas/common/errors.yaml#/ErrorResponse'
