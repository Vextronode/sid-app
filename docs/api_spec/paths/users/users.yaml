get:
  tags: [Epic 2 - Users, Citizens, Officials]
  summary: Lihat daftar akun sistem
  description: UC-14. Petugas Desa dapat melihat daftar akun; pembuatan akun langsung melalui POST /users telah dihapus.
  operationId: listUsers
  security:
    - sanctumCookie: []
  parameters:
    - name: role
      in: query
      required: false
      schema:
        type: string
        enum: [warga, rt, rw, kadus, kasi_pelayanan, kaur_tu_umum, petugas_desa, kepala_desa, sekretaris_desa]
  responses:
    '200':
      description: Daftar akun berhasil diambil
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  $ref: '../../schemas/users/users.yaml#/User'
    '401':
      $ref: '../../responses/common.yaml#/Unauthenticated'
    '403':
      $ref: '../../responses/common.yaml#/Forbidden'
