post:
  tags: [Epic 2 - Users, Citizens, Officials]
  summary: Membuat password sementara untuk akun non-Staf SIDUTama
  operationId: resetUserPassword
  security:
    - sanctumCookie: []
  parameters:
    - name: user
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    '200':
      description: Password sementara dibuat; tampilkan sekali kepada operator
      content:
        application/json:
          example:
            message: "Password sementara berhasil dibuat."
            temporary_password: "A1b2C3d4E5f6"
    '403':
      description: Hanya Staf SIDUTama dan bukan target diri sendiri atau Staf SIDUTama lain
    '404':
      description: Akun tidak ditemukan
