get:
  tags: [Epic 2 - Users, Citizens, Officials]
  summary: Lihat & cari daftar warga (berpaginasi)
  description: |
    UC-09. Aktor: Petugas Desa, Kasi Pelayanan, Kaur TU & Umum (Kasi/Kaur
    hanya membaca). Warga satu desa akun login, urut nama lalu id, berpaginasi
    di database. Pencarian nama case-insensitive (LIKE) dan filter wilayah
    bertingkat Dusun/RW/RT; RW dan Dusun dibaca lewat RT warga. Filter yang
    diisi bersamaan digabung dengan AND.
    Respons ResourceCollection berpaginasi: `data`, `total` (jumlah seluruh
    hasil), serta `links`/`meta` paginator Laravel.
  operationId: listCitizens
  security:
    - sanctumCookie: []
  parameters:
    - name: search
      in: query
      required: false
      description: Cari nama warga (maks 100 karakter).
      schema:
        type: string
        maxLength: 100
    - name: hamlet_id
      in: query
      required: false
      description: ID dusun; warga yang RT-nya berada di RW dusun ini.
      schema:
        type: integer
    - name: rw_id
      in: query
      required: false
      description: ID RW; warga yang RT-nya berada di RW ini.
      schema:
        type: integer
    - name: rt_id
      in: query
      required: false
      schema:
        type: integer
    - name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
    - name: per_page
      in: query
      required: false
      description: Default 20, maksimum 100.
      schema:
        type: integer
        minimum: 1
        maximum: 100
  responses:
    '200':
      description: Daftar warga (NIK ter-mask)
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  $ref: '../../schemas/citizens/citizens.yaml#/Citizen'
              total:
                type: integer
              links:
                type: object
              meta:
                $ref: '../../schemas/common/errors.yaml#/PaginationMeta'
    '401':
      $ref: '../../responses/common.yaml#/Unauthenticated'
    '403':
      $ref: '../../responses/common.yaml#/Forbidden'
    '422':
      $ref: '../../responses/common.yaml#/ValidationError'
post:
  tags: [Epic 2 - Users, Citizens, Officials]
  summary: Tambah warga baru
  description: |
    Aktor: Petugas Desa.
    UC-09 (Main Flow - Tambah Warga). NIK dienkripsi AES-256 (`nik`) dan
    di-hash SHA-256 (`nik_hash`) untuk indexing, dijalankan dalam satu
    `DB::transaction()`. BARU v5.0: `no_kk` DIHAPUS dari request ini -
    gunakan `family_id` untuk menautkan ke KK yang sudah ada (buat KK
    baru dulu lewat `POST /families` jika belum ada). Field baru:
    family_role, father_id/mother_id, blood_type, residency_type,
    origin_region.
  operationId: createCitizen
  security:
    - sanctumCookie: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../schemas/citizens/citizens.yaml#/CitizenCreateRequest'
  responses:
    '201':
      description: Data warga berhasil disimpan
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: "Data warga berhasil disimpan"
              data:
                $ref: '../../schemas/citizens/citizens.yaml#/Citizen'
    '401':
      $ref: '../../responses/common.yaml#/Unauthenticated'
    '403':
      $ref: '../../responses/common.yaml#/Forbidden'
    '422':
      description: NIK sudah terdaftar / format NIK salah / field wajib kosong / no_kk terkirim (dilarang di endpoint ini sejak v5.0)
      content:
        application/json:
          schema:
            $ref: '../../schemas/common/errors.yaml#/ValidationErrorResponse'
          examples:
            duplicate_nik:
              summary: NIK sudah terdaftar
              value:
                message: "The given data was invalid."
                errors:
                  nik: ["NIK sudah ada dalam database warga"]
            invalid_nik_format:
              summary: Format NIK salah
              value:
                message: "The given data was invalid."
                errors:
                  nik: ["NIK harus 16 digit angka"]
            no_kk_not_allowed:
              summary: "no_kk dikirim di endpoint ini (v5.0 memindahkan KK ke /families)"
              value:
                message: "The given data was invalid."
                errors:
                  no_kk: ["No KK tidak lagi dikelola di endpoint ini sejak v5.0. Gunakan family_id, atau buat KK baru via POST /families."]
