post:
  tags: [Epic 2 - Users, Citizens, Officials]
  summary: Import data warga massal via Excel
  description: |
    Aktor: Staf SIDUTama atau Kasi Pemerintahan.
    UC-09 (Main Flow - Import Excel). Library `maatwebsite/excel`.
    Validasi per baris (format NIK, duplikat), baris error di-skip,
    ringkasan hasil ditampilkan. Template diunduh dari
    GET /citizens/import-template; header kolomnya dibuat dari daftar yang
    sama dengan aturan `CitizensImport::rules()` (nik, name, date_of_birth,
    ..., residency_type, origin_region, title_front, ..., has_disorder,
    disability), jadi template dan validasi impor
    selalu sinkron. Tidak all-or-nothing: satu baris gagal tidak
    membatalkan baris lain yang valid (SID-ARCH-BE-001 S5.4).
  operationId: importCitizensExcel
  security:
    - sanctumCookie: []
  requestBody:
    required: true
    content:
      multipart/form-data:
        schema:
          type: object
          required: [file]
          properties:
            file:
              type: string
              format: binary
              description: File .xlsx, .xls, atau .csv (maks 10 MB) sesuai template dari GET /citizens/import-template
  responses:
    '200':
      description: Import selesai diproses (bisa parsial - lihat error_count)
      content:
        application/json:
          schema:
            $ref: '../../schemas/citizens/citizens.yaml#/CitizenImportResponse'
    '401':
      $ref: '../../responses/common.yaml#/Unauthenticated'
    '403':
      $ref: '../../responses/common.yaml#/Forbidden'
    '422':
      description: Format file tidak valid / header kolom tidak sesuai template
      content:
        application/json:
          schema:
            $ref: '../../schemas/common/errors.yaml#/ValidationErrorResponse'
          example:
            message: "Format file harus .xlsx atau .csv sesuai template"
            errors:
              file: ["Format file harus .xlsx atau .csv sesuai template"]
