get:
  tags: [Epic 2 - Users, Citizens, Officials]
  summary: Unduh template Excel impor warga
  description: |
    Aktor: Staf SIDUTama (`staf_sid`) atau Kasi Pemerintahan.
    UC-09. Template resmi dibuat server (`CitizensTemplateExport`) **setiap
    kali diunduh**, dari data desa pengunduh saat itu (dusun, RW, RT,
    Katalog Pekerjaan aktif). Formatnya langsung sesuai kriteria impor, jadi
    file dari template ini tidak membutuhkan alias atau pencocokan longgar.
    Dipakai untuk POST /citizens/import/preview dan POST /citizens/import.

    Tiga sheet:
    - **Data Warga**: judul kolom (kolom wajib bertanda ` *`): NIK *, NO KK,
      NAMA LENGKAP *, GELAR DEPAN, GELAR BELAKANG, TEMPAT LAHIR, TANGGAL
      LAHIR *, JENIS KELAMIN *, AGAMA, PENDIDIKAN TERAKHIR, PEKERJAAN, STATUS
      PERKAWINAN, SHDK, GOLONGAN DARAH, NAMA AYAH, NAMA IBU, ALAMAT *, DUSUN,
      RW *, RT *, STATUS DOMISILI, DOMISILI SEKARANG, JENIS PENDUDUK, DAERAH
      ASAL, NO AKTA LAHIR, NO AKTA KAWIN, TANGGAL PERKAWINAN, NO AKTA CERAI,
      TANGGAL PERCERAIAN, DISABILITAS.
      - Pilihan tetap sistem (jenis kelamin, agama, pendidikan, status kawin,
        SHDK, golongan darah, status domisili, jenis penduduk): dropdown
        ketat (Stop).
      - DUSUN, RW, PEKERJAAN: dropdown dari data desa; RT: dropdown yang
        mengikuti RW (`INDIRECT("RW_"&<sel RW>)`, named range per RW).
        Jenisnya peringatan (Warning): data yang baru ditambahkan di sistem
        setelah template diunduh tetap bisa diketik dan dicocokkan server ke
        database terbaru saat impor.
      - NIK, NO KK, RW, RT berformat Teks; kolom tanggal berupa sel tanggal
        (dd/mm/yyyy).
      - Baris 2: contoh isian (wilayah & pekerjaan nyata desa) dengan NIK
        `3201019999990001`; impor selalu melewati baris ini.
    - **Petunjuk**: tanggal pembuatan, cara mengisi, daftar kolom (wajib,
      isian yang diterima, contoh).
    - **Daftar Pilihan**: tabel Dusun - RW - RT dan daftar pekerjaan aktif
      per tanggal unduh; sumber dropdown sheet Data Warga.

    File template lama ber-header snake_case (nik, name, date_of_birth,
    rt_id, ...) tetap diterima impor.
  operationId: downloadCitizenImportTemplate
  security:
    - sanctumCookie: []
  responses:
    '200':
      description: File Excel (attachment `template_impor_warga.xlsx`)
      headers:
        Content-Disposition:
          schema:
            type: string
          example: 'attachment; filename=template_impor_warga.xlsx'
      content:
        application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
          schema:
            type: string
            format: binary
    '401':
      $ref: '../../responses/common.yaml#/Unauthenticated'
    '403':
      $ref: '../../responses/common.yaml#/Forbidden'
