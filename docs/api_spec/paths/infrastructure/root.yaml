servers:
  - url: https://api.sid-cibenda.id
    description: Root host (tanpa prefix /api)
security: []
get:
  tags: [Infrastruktur]
  summary: Memeriksa ketersediaan aplikasi
  security: []
  operationId: getApplicationRoot
  responses:
    '200':
      description: Aplikasi berjalan
      content:
        application/json:
          schema:
            type: object
            properties:
              Laravel:
                type: string
                description: Versi Laravel yang sedang berjalan.
                example: "13.0.0"
