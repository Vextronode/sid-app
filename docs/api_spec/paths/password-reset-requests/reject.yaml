post:
  tags: [Epic 3 - Autentikasi]
  summary: Tolak permintaan atur ulang kata sandi
  description: |
    Hanya Staf SIDUTama di desa yang sama. Catatan opsional.
  operationId: rejectPasswordResetRequest
  security:
    - sanctumCookie: []
  parameters:
    - name: resetRequest
      in: path
      required: true
      schema: { type: integer }
  requestBody:
    required: false
    content:
      application/json:
        schema:
          type: object
          properties:
            notes:
              type: string
              nullable: true
              maxLength: 500
  responses:
    '200':
      description: Berhasil
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: "Permintaan atur ulang kata sandi ditolak."
    '401':
      $ref: '../../responses/common.yaml#/Unauthenticated'
    '403':
      description: Bukan Staf SIDUTama di desa yang sama
    '409':
      description: Permintaan ini sudah diproses.
    '422':
      $ref: '../../responses/common.yaml#/ValidationError'
