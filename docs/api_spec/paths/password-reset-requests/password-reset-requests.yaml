get:
  tags: [Epic 3 - Autentikasi]
  summary: Daftar permintaan atur ulang kata sandi (tanpa email)
  description: |
    Aktor: Staf SIDUTama. Sisi petugas dari lupa kata sandi lewat NIK +
    tanggal lahir untuk akun tanpa email: daftar permintaan akun di
    desanya, berpaginasi.
  operationId: listPasswordResetRequests
  security:
    - sanctumCookie: []
  parameters:
    - name: status
      in: query
      required: false
      schema:
        type: string
        enum: [pending, approved, rejected, completed, cancelled]
    - name: page
      in: query
      required: false
      schema: { type: integer, minimum: 1 }
    - name: per_page
      in: query
      required: false
      description: Default 15, maksimum 100.
      schema: { type: integer, minimum: 1, maximum: 100 }
  responses:
    '200':
      description: Koleksi resource Laravel (`data`, `links`, `meta`)
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  $ref: '../../schemas/account-requests/account-requests.yaml#/PasswordResetRequest'
              links: { type: object }
              meta: { type: object }
    '401':
      $ref: '../../responses/common.yaml#/Unauthenticated'
    '403':
      $ref: '../../responses/common.yaml#/Forbidden'
    '422':
      $ref: '../../responses/common.yaml#/ValidationError'
post:
  tags: [Epic 3 - Autentikasi]
  summary: Ajukan atur ulang kata sandi tanpa email (belum login)
  description: |
    Endpoint web (tanpa prefix `/api`, middleware `guest`). Untuk akun tanpa
    email: pengaju dikenali lewat NIK + tanggal lahir. Semua kegagalan (NIK
    tidak ada, tanggal lahir salah, belum punya akun, akun nonaktif) dijawab
    422 dengan pesan yang sama agar tidak bisa dipakai menebak data
    kependudukan. Respons membawa `token` klaim acak 64 karakter yang
    disimpan di browser pengaju (server hanya menyimpan hash-nya); pengajuan
    baru menggantikan permintaan lama akun itu. Staf SIDUTama desa yang sama
    menerima notifikasi. Throttle 5/menit per IP dan 5/jam per NIK.
  operationId: submitPasswordResetRequest
  servers:
    - url: /
  security: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required: [nik, date_of_birth]
          properties:
            nik: { type: string, pattern: '^[0-9]{16}$' }
            date_of_birth: { type: string, format: date }
  responses:
    '201':
      description: Permintaan terkirim
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: '../../schemas/account-requests/account-requests.yaml#/PasswordResetRequestStatus'
              message:
                type: string
                example: "Permintaan terkirim. Harap cek kembali halaman ini setelah disetujui staf desa."
              token:
                type: string
                description: Token klaim; simpan di perangkat pengaju, dipakai untuk status dan complete.
    '403':
      description: Akun Staf SIDUTama (dipulihkan lewat CLI, bukan permintaan ini)
    '422':
      $ref: '../../responses/common.yaml#/ValidationError'
    '429':
      description: Terlalu banyak permintaan
