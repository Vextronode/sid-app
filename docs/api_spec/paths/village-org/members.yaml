post:
  tags: [Epic 10 - Organisasi Non-Struktural Desa]
  summary: Tambah / rotasi anggota untuk suatu jabatan organisasi
  description: |
    Aktor: Staf SIDUTama.
    UC-23. Untuk slot `ketua`/`wakil_ketua` (is_single_occupant=true)
    yang sudah terisi, pemegang lama diakhiri (ended_at = started_at)
    lalu pemegang baru dicatat. Dengan `previous_holder=to_member`,
    pemegang lama sekaligus dicatat sebagai Anggota aktif. Untuk slot
    `anggota`, anggota baru ditambahkan tanpa mengakhiri yang lama.

    Dengan `from_member_id`, yang diisikan adalah anggota/wakil aktif
    organisasi yang sama (promosi): masa jabatan lamanya diakhiri dan
    nama/foto/WA disalin, sehingga `member_name` tidak wajib. Semua
    langkah berjalan dalam satu transaksi.
  operationId: addVillageOrgMember
  security:
    - sanctumCookie: []
  parameters:
    - name: position
      in: path
      required: true
      schema:
        type: integer
      example: 1
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../schemas/village-org/village-org.yaml#/VillageOrgMemberCreateRequest'
  responses:
    '201':
      description: Anggota berhasil ditambahkan / dirotasi
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: "Anggota berhasil ditambahkan"
              data:
                $ref: '../../schemas/village-org/village-org.yaml#/VillageOrgMember'
    '401':
      $ref: '../../responses/common.yaml#/Unauthenticated'
    '403':
      description: |
        Tidak berwenang, atau fitur rotasi belum diaktifkan untuk
        org_type ini (pending konfirmasi desa)
      content:
        application/json:
          schema:
            $ref: '../../schemas/common/errors.yaml#/ForbiddenResponse'
          examples:
            not_authorized:
              summary: Bukan Staf SIDUTama
              value:
                message: "Anda tidak memiliki akses untuk aksi ini."
            feature_pending:
              summary: Fitur rotasi belum diaktifkan
              value:
                message: "Fitur rotasi untuk organisasi ini belum diaktifkan, menunggu konfirmasi desa."
    '404':
      $ref: '../../responses/common.yaml#/NotFound'
    '422':
      $ref: '../../responses/common.yaml#/ValidationError'
