post:
  tags: [Epic 10 - Organisasi Non-Struktural Desa]
  summary: Akhiri pemegang Ketua/Wakil Ketua (kosongkan atau turunkan jadi Anggota)
  description: |
    Aktor: Staf SIDUTama. Hanya untuk pemegang aktif slot `ketua` atau
    `wakil_ketua`. Masa jabatannya diakhiri (masuk riwayat) sehingga slot
    kosong. Dengan `to_member=true`, ia sekaligus dicatat sebagai Anggota
    aktif mulai `ended_at`.
  operationId: endVillageOrgMember
  security:
    - sanctumCookie: []
  parameters:
    - name: position
      in: path
      required: true
      schema:
        type: integer
      example: 1
    - name: id
      in: path
      required: true
      schema:
        type: integer
      example: 1
  requestBody:
    required: false
    content:
      application/json:
        schema:
          type: object
          properties:
            ended_at:
              type: string
              format: date
              nullable: true
              description: Default hari ini.
              example: "2026-10-01"
            to_member:
              type: boolean
              example: false
  responses:
    '200':
      description: Masa jabatan berhasil diakhiri
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: '../../schemas/village-org/village-org.yaml#/VillageOrgMember'
    '401':
      $ref: '../../responses/common.yaml#/Unauthenticated'
    '403':
      $ref: '../../responses/common.yaml#/Forbidden'
    '404':
      $ref: '../../responses/common.yaml#/NotFound'
    '422':
      description: Slot Anggota, atau masa jabatan sudah berakhir
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: "Masa jabatan anggota ini sudah berakhir."
