get:
  tags: [Epic 10 - Organisasi Non-Struktural Desa]
  summary: Lihat slot jabatan organisasi non-struktural (BPD/LPM/Karang Taruna/PKK)
  description: |
    UC-23. Aktor Staf SIDUTama. Berbeda dengan `officials` (jabatan
    struktural desa) - ini untuk organisasi seperti BPD, LPM, dst.
    Setiap organisasi punya tiga slot tetap: `ketua` dan `wakil_ketua`
    (satu pemegang, rotasi) serta `anggota` (jumlah bebas). Slot yang
    belum ada dibuat otomatis saat daftar diminta (untuk `org_type`
    yang difilter, atau bpd/lpm/karang_taruna/pkk tanpa filter).
    Slot tidak bisa dibuat, diubah, atau dihapus lewat API.
  operationId: listVillageOrgPositions
  security:
    - sanctumCookie: []
  parameters:
    - name: org_type
      in: query
      required: false
      schema:
        type: string
        enum: [bpd, bumdes, lpm, karang_taruna, pkk]
      example: "bpd"
  responses:
    '200':
      description: Daftar jabatan organisasi berhasil diambil (termasuk member aktif)
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  $ref: '../../schemas/village-org/village-org.yaml#/VillageOrgPosition'
          example:
            data:
              - id: 1
                org_type: "bpd"
                slot: "ketua"
                position_label: "Ketua"
                is_single_occupant: true
                is_active: true
                members:
                  - id: 1
                    member_name: "Budi Santoso"
                    started_at: "2024-01-01"
                    is_active: true
    '401':
      $ref: '../../responses/common.yaml#/Unauthenticated'
    '403':
      $ref: '../../responses/common.yaml#/Forbidden'
