parameters:
  - name: disasterAlert
    in: path
    required: true
    schema:
      type: string
      format: uuid
post:
  tags: [Epic 9 - Halaman Publik & Konten]
  summary: Tampilkan lagi peringatan SIGAP yang diturunkan
  description: |
    Eksklusif Staf SIDUTama, hanya peringatan desanya (lainnya 404). Hanya
    untuk peringatan yang diturunkan, belum diakhiri SIGAP, dan belum lewat
    masa tayang (lainnya 409). Tidak mengirim notifikasi ulang. Dicatat di
    activity log (`log_name` `disaster_alert`, event `restored`).
  operationId: restoreDisasterAlert
  security:
    - sanctumCookie: []
  responses:
    '200':
      description: Peringatan tampil lagi
      content:
        application/json:
          schema:
            $ref: '../../schemas/disaster-alerts/disaster-alerts.yaml#/DisasterAlertMessage'
    '401':
      $ref: '../../responses/common.yaml#/Unauthenticated'
    '403':
      $ref: '../../responses/common.yaml#/Forbidden'
    '404':
      $ref: '../../responses/common.yaml#/NotFound'
    '409':
      $ref: '../../responses/common.yaml#/Conflict'
