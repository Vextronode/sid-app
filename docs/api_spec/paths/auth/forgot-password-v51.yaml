servers:
  - url: https://api.sid-cibenda.id
    description: Endpoint web autentikasi (tanpa prefix /api)
security: []
post:
  tags: [Epic 3 - Autentikasi]
  summary: Meminta tautan reset password melalui email
  security:
    - sanctumCookie: []
  description: Email wajib tersedia pada akun untuk menggunakan pemulihan password standar Laravel.
  operationId: requestPasswordReset
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required: [email]
          properties:
            email:
              type: string
              format: email
  responses:
    '200':
      description: Status pengiriman tautan reset
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: string
    '422':
      description: Email tidak valid atau tautan tidak dapat dikirim
