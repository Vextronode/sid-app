post:
  tags: [Epic 3 - Autentikasi]
  summary: Unggah atau ganti foto profil sendiri (akun warga)
  description: |
    Hanya akun berperan `warga`. Akun yang sedang menjabat (RT sampai
    Kepala Desa, termasuk Petugas Desa) ditolak 403: fotonya adalah foto
    pejabat yang dikelola Petugas Desa di halaman Pejabat Desa. Setelah
    kembali menjadi warga, foto akun bisa diubah lagi. Foto lama dihapus.
  operationId: uploadOwnProfilePhoto
  security:
    - sanctumCookie: []
  requestBody:
    required: true
    content:
      multipart/form-data:
        schema:
          type: object
          required: [photo]
          properties:
            photo:
              type: string
              format: binary
              description: PNG, JPG, atau WEBP. Maksimal 5 MB.
  responses:
    '200':
      description: Foto profil disimpan
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: "Foto profil berhasil disimpan."
              data:
                $ref: '../../schemas/users/users.yaml#/User'
    '401':
      $ref: '../../responses/common.yaml#/Unauthenticated'
    '403':
      description: Akun sedang menjabat
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: "Foto pejabat dikelola Petugas Desa lewat halaman Pejabat Desa."
    '422':
      $ref: '../../responses/common.yaml#/ValidationError'
delete:
  tags: [Epic 3 - Autentikasi]
  summary: Hapus foto profil sendiri (akun warga)
  description: Aturan akses sama dengan POST.
  operationId: deleteOwnProfilePhoto
  security:
    - sanctumCookie: []
  responses:
    '200':
      description: Foto profil dihapus
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: "Foto profil berhasil dihapus."
              data:
                $ref: '../../schemas/users/users.yaml#/User'
    '401':
      $ref: '../../responses/common.yaml#/Unauthenticated'
    '403':
      $ref: '../../responses/common.yaml#/Forbidden'
