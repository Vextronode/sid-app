servers:
  - url: https://api.sid-cibenda.id
    description: Endpoint web autentikasi (tanpa prefix /api)
security: []
post:
  tags: [Epic 3 - Autentikasi]
  summary: Mengatur password baru menggunakan token email
  security:
    - sanctumCookie: []
  operationId: resetPassword
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required: [token, email, password, password_confirmation]
          properties:
            token:
              type: string
            email:
              type: string
              format: email
            password:
              type: string
              format: password
            password_confirmation:
              type: string
              format: password
  responses:
    '200':
      description: Password berhasil diatur
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: string
    '422':
      description: Token, email, atau password tidak valid
