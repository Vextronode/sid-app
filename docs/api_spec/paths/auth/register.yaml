servers:
  - url: https://api.sid-cibenda.id
    description: Endpoint web autentikasi (tanpa prefix /api)
security: []
post:
  tags: [Epic 3 - Autentikasi]
  summary: Register akun warga (self-service)
  security:
    - sanctumCookie: []
  description: |
    UC-17. Request hanya NIK, password, dan konfirmasi password. Sistem
    memeriksa NIK aktif melalui nik_hash, menghasilkan username otomatis,
    membuat sesi login, dan mengembalikan username serta nama.
  operationId: registerWarga
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../schemas/auth/auth.yaml#/RegisterRequest'
  responses:
    '201':
      description: Akun warga berhasil dibuat
      content:
        application/json:
          schema:
            $ref: '../../schemas/auth/auth.yaml#/RegisterResponse'
    '422':
      description: Validasi gagal - NIK tidak ditemukan, NIK sudah punya akun, atau format tidak valid
      content:
        application/json:
          schema:
            $ref: '../../schemas/common/errors.yaml#/ValidationErrorResponse'
          examples:
            nik_not_found:
              summary: NIK tidak terdaftar sebagai warga Desa Cibenda
              value:
                message: "The given data was invalid."
                errors:
                  nik: ["NIK tidak terdaftar sebagai warga Desa Cibenda"]
            nik_already_registered:
              summary: NIK sudah terdaftar dan punya akun
              value:
                message: "The given data was invalid."
                errors:
                  nik: ["NIK sudah terdaftar, silakan login"]
            weak_password:
              summary: Password terlalu lemah
              value:
                message: "The given data was invalid."
                errors:
                  password: ["Password minimal 8 karakter dan mengandung kombinasi huruf & angka"]
    '500':
      $ref: '../../responses/common.yaml#/ServerError'
