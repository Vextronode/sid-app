servers:
  - url: /
    description: Endpoint web autentikasi (tanpa prefix /api)
post:
  tags: [Epic 3 - Autentikasi]
  summary: Register akun warga (self-service)
  security: []
  description: |
    UC-17. Request NIK, tanggal lahir, password, dan konfirmasi password
    (throttle `register`: 5/menit per IP, 10/jam per hash NIK). Sistem
    memeriksa NIK melalui nik_hash, mencocokkan tanggal lahir dengan
    `citizens.date_of_birth`, menghasilkan username otomatis, memicu event
    `Registered`, dan mengembalikan username serta nama. Register tidak
    membuat sesi; pengguna login terpisah.
  operationId: registerWarga
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../schemas/auth/auth.yaml#/RegisterRequest'
  responses:
    '201':
      description: Akun warga berhasil dibuat
      content:
        application/json:
          schema:
            $ref: '../../schemas/auth/auth.yaml#/RegisterResponse'
    '422':
      description: Validasi gagal - NIK tidak ditemukan, NIK sudah punya akun, tanggal lahir tidak cocok, atau format tidak valid
      content:
        application/json:
          schema:
            $ref: '../../schemas/common/errors.yaml#/ValidationErrorResponse'
          examples:
            nik_not_found:
              summary: NIK tidak terdaftar sebagai warga Desa Cibenda
              value:
                message: "The given data was invalid."
                errors:
                  nik: ["NIK tidak terdaftar sebagai warga Desa Cibenda"]
            nik_already_registered:
              summary: NIK sudah terdaftar dan punya akun
              value:
                message: "The given data was invalid."
                errors:
                  nik: ["NIK sudah terdaftar, silakan login"]
            dob_mismatch:
              summary: Tanggal lahir tidak cocok dengan data kependudukan
              value:
                message: "Tanggal lahir tidak sesuai dengan data kependudukan"
                errors:
                  date_of_birth: ["Tanggal lahir tidak sesuai dengan data kependudukan"]
            weak_password:
              summary: Password terlalu lemah
              value:
                message: "The given data was invalid."
                errors:
                  password: ["Password minimal 8 karakter dan mengandung kombinasi huruf & angka"]
    '500':
      $ref: '../../responses/common.yaml#/ServerError'
