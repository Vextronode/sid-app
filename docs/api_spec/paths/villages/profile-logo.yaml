post:
  tags: [Epic 9 - Halaman Publik & Konten]
  summary: Upload atau ganti logo desa
  description: |
    Aktor: Staf SIDUTama aktif pada desanya. Logo tampil di header publik,
    header role, dan sidebar operator, jadi disimpan di disk public
    (`village-media/{village_id}/...`). Sebelum disimpan gambar dioptimasi
    (VillageImageOptimizer): rotasi EXIF diterapkan, diperkecil proporsional
    hingga sisi terpanjang 512 px, dan disimpan sebagai WebP bila GD
    mendukung (fallback PNG; berkas asli bila tidak dapat diproses). Berkas
    unggahan lama dihapus; nilai awal dari seeder (path `/assets/...`) tidak
    disentuh. Cache halaman publik desa ikut digugurkan.
  operationId: uploadVillageLogo
  security:
    - sanctumCookie: []
  requestBody:
    required: true
    content:
      multipart/form-data:
        schema:
          $ref: '../../schemas/villages/villages.yaml#/VillageImageUpload'
  responses:
    '200':
      description: Logo diperbarui
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: "Logo desa berhasil diperbarui."
              data:
                $ref: '../../schemas/villages/villages.yaml#/Village'
    '401':
      $ref: '../../responses/common.yaml#/Unauthenticated'
    '403':
      $ref: '../../responses/common.yaml#/Forbidden'
    '422':
      description: Bukan PNG/JPG/WebP atau lebih dari 2 MB
      content:
        application/json:
          schema:
            $ref: '../../schemas/common/errors.yaml#/ValidationErrorResponse'
