get:
  tags: [Epic 9 - Halaman Publik & Konten]
  summary: Info jenis surat & persyaratan (tanpa login)
  security: []
  description: |
    UC-16. Jenis surat aktif ber-template milik desa (urut nama), hanya
    code, name, category, category_label, requirements_info. Cache per desa (10 menit).
  operationId: getPublicLetterTypes
  parameters:
    - $ref: '../../parameters/common.yaml#/VillageCode'
  responses:
    '200':
      description: Daftar jenis surat publik
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  $ref: '../../schemas/letter-types/letter-types.yaml#/PublicLetterType'
    '404':
      description: Desa tidak ditemukan, atau belum ada tipe surat aktif
      content:
        application/json:
          schema:
            $ref: '../../schemas/common/errors.yaml#/NotFoundResponse'
    '422':
      description: village_code wajib pada instalasi multi-desa
