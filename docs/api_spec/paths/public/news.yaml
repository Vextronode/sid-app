get:
  tags: [Epic 9 - Halaman Publik & Konten]
  summary: Daftar berita publik (tanpa login, berpaginasi)
  security: []
  description: |
    UC-16. Berita `is_published = true` milik desa, terbaru dulu, 10 per
    halaman, beserta kategori. Respons paginator Laravel standar (data,
    links, meta). Cache per desa per nomor halaman (10 menit).
  operationId: getPublicNewsList
  parameters:
    - $ref: '../../parameters/common.yaml#/VillageCode'
    - name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
  responses:
    '200':
      description: Daftar berita publik
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  $ref: '../../schemas/news/news.yaml#/News'
              links:
                type: object
              meta:
                $ref: '../../schemas/common/errors.yaml#/PaginationMeta'
    '404':
      description: Profil desa belum tersedia / village_code tidak dikenal
    '422':
      $ref: '../../responses/common.yaml#/ValidationError'
