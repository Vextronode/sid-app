get:
  tags: [Epic 9 - Halaman Publik & Konten]
  summary: Profil desa publik (tanpa login)
  security: []
  description: |
    UC-16. Identitas desa (VillageResource) ditambah:
    - `stats`: jumlah warga aktif & dusun aktif (dihitung dari data);
    - `officials`: perangkat desa aktif berurutan Kepala Desa, Sekdes, grup
      Kasi/Kaur/Staf (kasi_pelayanan, kaur_tu_umum, lalu jenis jabatan desa
      aktif menurut sort_order), lalu Kepala Dusun. RT, RW, Petugas Desa
      tidak ditampilkan. Tanpa kontak/NIK.
    - `positions`: slot grup Kasi/Kaur/Staf (termasuk yang belum terisi);
    - `hamlets`: dusun aktif (slot Kepala Dusun per dusun).
    Di-cache per desa (10 menit).
  operationId: getPublicVillageProfile
  parameters:
    - $ref: '../../parameters/common.yaml#/VillageCode'
  responses:
    '200':
      description: Profil desa publik
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: '../../schemas/villages/villages.yaml#/Village'
              stats:
                $ref: '../../schemas/villages/villages.yaml#/PublicStats'
              officials:
                type: array
                items:
                  $ref: '../../schemas/users/users.yaml#/PublicOfficial'
              positions:
                type: array
                items:
                  type: object
                  properties:
                    code:
                      type: string
                      example: "kasi_kesejahteraan"
                    label:
                      type: string
                      example: "Kasi Kesejahteraan"
              hamlets:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    name:
                      type: string
    '404':
      description: Profil desa belum tersedia / village_code tidak dikenal
    '422':
      description: village_code wajib pada instalasi multi-desa
