post:
  tags: [Epic 3 - Autentikasi]
  summary: Tolak aktivasi akun warga
  description: |
    Wajib catatan. NIK yang ditolak 3 kali (`MAX_REJECTIONS`) diblokir dari
    pendaftaran online; Staf SIDUTama dapat mengaktifkannya manual.
  operationId: rejectAccountRegistration
  security:
    - sanctumCookie: []
  parameters:
    - name: accountRegistration
      in: path
      required: true
      schema: { type: integer }
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required: [notes]
          properties:
            notes:
              type: string
              minLength: 5
              maxLength: 500
              description: Catatan penolakan (wajib).
  responses:
    '200':
      description: Berhasil
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: "Pendaftaran akun ditolak."
    '401':
      $ref: '../../responses/common.yaml#/Unauthenticated'
    '403':
      description: Bukan pemegang permintaan saat ini
    '409':
      description: Permintaan aktivasi ini sudah diputuskan.
    '422':
      $ref: '../../responses/common.yaml#/ValidationError'
