get:
  tags: [Epic 3 - Autentikasi]
  summary: Foto kamera pendaftaran akun
  description: |
    Stream foto dari disk privat untuk petugas yang boleh melihat
    permintaannya. Tersedia selama diproses atau setelah ditolak.
  operationId: accountRegistrationPhoto
  security:
    - sanctumCookie: []
  parameters:
    - name: accountRegistration
      in: path
      required: true
      schema: { type: integer }
  responses:
    '200':
      description: Berkas gambar
      content:
        image/*:
          schema:
            type: string
            format: binary
    '401':
      $ref: '../../responses/common.yaml#/Unauthenticated'
    '403':
      $ref: '../../responses/common.yaml#/Forbidden'
    '404':
      description: Foto tidak tersedia.
