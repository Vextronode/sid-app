get:
  tags: [Epic 3 - Autentikasi]
  summary: Riwayat CPMI milik akun
  description: |
    Data CPMI warga akun login (`users.citizen_id`), terbaru dulu, satu baris
    per keberangkatan. Semua role ber-akun; akun tanpa data warga mendapat
    daftar kosong. Tanpa paginasi.
  operationId: listOwnMigrantWorkers
  security:
    - sanctumCookie: []
  responses:
    '200':
      description: Riwayat CPMI milik akun ini
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  $ref: '../../schemas/migrant-workers/migrant-workers.yaml#/MigrantWorkerSummary'
              total:
                type: integer
    '401':
      $ref: '../../responses/common.yaml#/Unauthenticated'
