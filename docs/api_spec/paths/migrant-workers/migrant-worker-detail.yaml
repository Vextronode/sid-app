get:
  tags: [Epic 2 - Users, Citizens, Officials]
  summary: Detail CPMI (baca saja)
  description: |
    Aktor sama dengan `GET /migrant-workers` (data desa lain 403), ditambah
    warga pemilik data. Memuat identitas dari data penduduk, rincian
    pendidikan/kompetensi, penanggung jawab, penempatan, dan 10 dokumen wajib.
  operationId: showMigrantWorker
  security:
    - sanctumCookie: []
  parameters:
    - name: migrantWorker
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    '200':
      description: Detail CPMI
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: '../../schemas/migrant-workers/migrant-workers.yaml#/MigrantWorkerDetail'
    '401':
      $ref: '../../responses/common.yaml#/Unauthenticated'
    '403':
      $ref: '../../responses/common.yaml#/Forbidden'
    '404':
      $ref: '../../responses/common.yaml#/NotFound'
