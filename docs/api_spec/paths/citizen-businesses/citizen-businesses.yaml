get:
  tags: [Epic 2 - Users, Citizens, Officials]
  summary: Data Usaha Warga (berpaginasi, baca saja)
  description: |
    Aktor: Staf SIDUTama dan petugas SKU, yaitu Kasi/Kaur yang cocok dengan
    `letter_types.assigned_role` milik A01 di desanya (NULL = Kasi
    Pemerintahan dan Kaur TU & Umum). Akses mengikuti jenis surat, jadi ikut
    pindah bila kategori SKU diubah; role lain 403. Usaha satu desa akun
    login, terbaru dulu. Respons ResourceCollection berpaginasi: `data`,
    `total`, serta `links`/`meta` paginator Laravel.
  operationId: listCitizenBusinesses
  security:
    - sanctumCookie: []
  parameters:
    - name: search
      in: query
      required: false
      description: Cari nama usaha atau nama warga pemilik (case-insensitive).
      schema:
        type: string
        maxLength: 100
    - name: category
      in: query
      required: false
      schema:
        type: string
        enum: [kelontong, kuliner, non_kuliner]
    - name: letter_status
      in: query
      required: false
      description: |
        `berlaku` = SKU tanpa `expires_at` atau `expires_at` >= sekarang;
        `kedaluwarsa` = `expires_at` < sekarang.
      schema:
        type: string
        enum: [berlaku, kedaluwarsa]
    - name: cimart_status
      in: query
      required: false
      description: "`none` = belum pernah didaftarkan."
      schema:
        type: string
        enum: [none, pending, accepted, rejected, cancelled]
    - name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
    - name: per_page
      in: query
      required: false
      description: Default 20, maksimum 100.
      schema:
        type: integer
        minimum: 1
        maximum: 100
  responses:
    '200':
      description: Daftar usaha
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  $ref: '../../schemas/citizen-businesses/citizen-businesses.yaml#/CitizenBusiness'
              total:
                type: integer
              links:
                type: object
              meta:
                $ref: '../../schemas/common/errors.yaml#/PaginationMeta'
    '401':
      $ref: '../../responses/common.yaml#/Unauthenticated'
    '403':
      $ref: '../../responses/common.yaml#/Forbidden'
    '422':
      $ref: '../../responses/common.yaml#/ValidationError'
