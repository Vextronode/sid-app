get:
  tags: [Epic 4 - Konfigurasi Tipe Surat & Pipeline Approval]
  summary: Lihat detail 1 flow beserta steps-nya
  operationId: getApprovalFlow
  security:
    - sanctumCookie: []
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
      example: 3
  responses:
    '200':
      description: Detail flow berhasil diambil
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: '../../schemas/letter-categories/letter-categories.yaml#/ApprovalFlow'
    '401':
      $ref: '../../responses/common.yaml#/Unauthenticated'
    '403':
      $ref: '../../responses/common.yaml#/Forbidden'
    '404':
      $ref: '../../responses/common.yaml#/NotFound'
patch:
  tags: [Epic 4 - Konfigurasi Tipe Surat & Pipeline Approval]
  summary: Edit nama/deskripsi/status aktif flow
  description: |
    Tidak mengubah steps - gunakan PUT /approval-flows/{id}/steps untuk itu.
  operationId: updateApprovalFlow
  security:
    - sanctumCookie: []
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
      example: 3
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            name:
              type: string
              example: "RT-Kades/Sekdes-Staff (3 Tahap) - Revisi"
            description:
              type: string
              nullable: true
            is_active:
              type: boolean
              example: true
  responses:
    '200':
      description: Flow berhasil diperbarui
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: '../../schemas/letter-categories/letter-categories.yaml#/ApprovalFlow'
    '401':
      $ref: '../../responses/common.yaml#/Unauthenticated'
    '403':
      $ref: '../../responses/common.yaml#/Forbidden'
    '404':
      $ref: '../../responses/common.yaml#/NotFound'
    '409':
      description: |
        Flow sedang dipakai (ada letters.flow_id yang menunjuk ke sini
        dengan status pending/in_progress) - menonaktifkan flow yang
        masih berjalan bisa membuat surat "nyasar". Sistem menolak
        is_active=false jika kondisi ini terpenuhi.
      content:
        application/json:
          schema:
            $ref: '../../schemas/common/errors.yaml#/ConflictResponse'
          example:
            message: "Flow ini masih dipakai surat yang sedang berjalan, tidak bisa dinonaktifkan."
    '422':
      $ref: '../../responses/common.yaml#/ValidationError'
