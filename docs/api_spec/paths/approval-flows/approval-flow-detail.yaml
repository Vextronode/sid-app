get:
  tags: [Epic 4 - Konfigurasi Tipe Surat & Pipeline Approval]
  summary: Lihat detail flow approval (read-only)
  description: |
    Aktor: Staf SIDUTama. Flow dicari dalam desa akun yang login; flow milik
    desa lain menghasilkan 404.
  operationId: showApprovalFlow
  security:
    - sanctumCookie: []
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
  responses:
    '200':
      description: Detail flow beserta step
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: '../../schemas/approval-flows/approval-flows.yaml#/ApprovalFlow'
    '401':
      $ref: '../../responses/common.yaml#/Unauthenticated'
    '403':
      $ref: '../../responses/common.yaml#/Forbidden'
    '404':
      $ref: '../../responses/common.yaml#/NotFound'
