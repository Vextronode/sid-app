put:
  tags: [Epic 4 - Konfigurasi Tipe Surat & Pipeline Approval]
  summary: Ganti seluruh urutan step approval untuk 1 flow
  description: |
    BARU v5.0. Replace-all (bukan partial patch) karena step_order antar
    step saling bergantung - mengganti satu tanpa yang lain berisiko
    membuat urutan tidak konsisten. `approver_position` HANYA boleh salah
    satu dari 5 nilai (rt, kepala_desa, sekdes, kasi_pelayanan, kaur_tu_umum) -
    'rw' dan 'kadus' akan ditolak validasi karena keduanya tidak pernah
    menjadi approver_position yang valid sejak v5.0 (SID-ARCH-BE-001 S3.2).

    Catatan step Kades/Sekdes (⚠ status asumsi, lihat SID-ARCH-BE-001 S3.3):
    karena kolom approver_position adalah ENUM tunggal, "saling menggantikan"
    Kades/Sekdes direpresentasikan sebagai SATU row dengan approver_position
    salah satu saja (backend resolve tetap query WHERE position IN
    ('kepala_desa','sekdes') untuk step tersebut). Field ini tidak mendukung
    multi-value per step - desain resmi BE mengasumsikan representasi 1 row.
  operationId: replaceApprovalFlowSteps
  security:
    - sanctumCookie: []
  parameters:
    - name: id
      in: path
      required: true
      description: flow_id
      schema:
        type: integer
      example: 3
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../schemas/letter-categories/letter-categories.yaml#/ApprovalFlowStepsReplaceRequest'
  responses:
    '200':
      description: Steps berhasil diganti
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: "Urutan approval berhasil diperbarui"
              data:
                type: array
                items:
                  $ref: '../../schemas/letter-categories/letter-categories.yaml#/FlowStep'
    '401':
      $ref: '../../responses/common.yaml#/Unauthenticated'
    '403':
      $ref: '../../responses/common.yaml#/Forbidden'
    '404':
      $ref: '../../responses/common.yaml#/NotFound'
    '409':
      description: |
        Flow sedang dipakai surat yang berjalan (letters.flow_id snapshot) -
        mengganti steps tidak memengaruhi surat yang sudah submit (flow_id
        dikunci sebagai snapshot), tapi sistem tetap memperingatkan jika
        ada surat in_progress yang memakai flow ini agar admin sadar
        dampaknya untuk surat BARU yang akan submit setelah ini.
      content:
        application/json:
          schema:
            $ref: '../../schemas/common/errors.yaml#/ConflictResponse'
          example:
            message: "Ada 5 surat sedang berjalan dengan flow ini. Perubahan hanya berlaku untuk surat baru."
    '422':
      description: step_order duplikat, approver_position tidak valid (misal 'rw'/'kadus'), atau tidak ada step is_final=true
      content:
        application/json:
          schema:
            $ref: '../../schemas/common/errors.yaml#/ValidationErrorResponse'
          examples:
            invalid_position:
              summary: approver_position tidak valid
              value:
                message: "The given data was invalid."
                errors:
                  "steps.1.approver_position": ["RW dan Kadus tidak dapat menjadi approver_position sejak v5.0"]
            no_final_step:
              summary: Tidak ada step final
              value:
                message: "The given data was invalid."
                errors:
                  steps: ["Minimal satu step harus is_final=true"]
            duplicate_order:
              summary: step_order duplikat
              value:
                message: "The given data was invalid."
                errors:
                  steps: ["step_order harus unik dalam satu flow"]
