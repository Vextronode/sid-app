get:
  tags: [Epic 4 - Konfigurasi Tipe Surat & Pipeline Approval]
  summary: Lihat daftar flow approval (read-only)
  description: |
    Aktor: Staf SIDUTama. Mengembalikan flow aktif milik desa akun yang
    login, beserta step-nya. Flow diset developer lewat seeder; tidak ada
    endpoint tulis (create/update/replace steps sudah dihapus).
  operationId: listApprovalFlows
  security:
    - sanctumCookie: []
  responses:
    '200':
      description: Daftar flow aktif berhasil diambil
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  $ref: '../../schemas/approval-flows/approval-flows.yaml#/ApprovalFlow'
          example:
            data:
              - id: 1
                name: "RT-Kades/Sekdes (2 Tahap)"
                description: "Flow default 2 tahap: RT -> Kepala Desa."
                is_active: true
                steps:
                  - { id: 1, flow_id: 1, step_order: 1, approver_position: "rt", is_final: false }
                  - { id: 2, flow_id: 1, step_order: 2, approver_position: "kepala_desa", is_final: true }
    '401':
      $ref: '../../responses/common.yaml#/Unauthenticated'
    '403':
      $ref: '../../responses/common.yaml#/Forbidden'
