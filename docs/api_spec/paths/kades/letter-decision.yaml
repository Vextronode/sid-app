patch:
  tags: [Epic 5 - Alur Pengajuan & Approval Surat]
  summary: Keputusan approve/reject Kepala Desa / Sekretaris Desa (tahap final)
  description: |
    UC-04c. Aktor role `kepala_desa` atau `sekretaris_desa` dengan jabatan
    aktif `kepala_desa`/`sekdes` di desa surat, bukan pemohon sendiri. Step
    aktif harus `kepala_desa`. First-action-wins: surat dikunci
    (`lockForUpdate`), lalu status dan step diperiksa ulang; request kedua
    mendapat 409. `approval_level` mencatat aktor sebenarnya (`kepala_desa`
    atau `sekdes`).

    **Approve pada step final**: status `approved`, `letter_number` dibuat
    (`{classification_code}/{NNN}/Des/{bulan Romawi}/{tahun}`, counter per
    desa + kode klasifikasi + tahun), `expires_at` dari `validity_days`,
    `processed_at`; lalu **snapshot render** dibekukan (`letters.snapshot`,
    `signed_by_official_id` = Kepala Desa aktif, termasuk bila Sekdes yang
    menyetujui; ditunda ke unduhan pertama bila belum ada Kades aktif).
    Notifikasi `letter_approved_final` ke pemohon, dan ke Kasi/Kaur sesuai
    `assigned_role`: `letter_needs_fulfillment` bila jenis surat punya
    `data_action`, selain itu `letter_ready_for_print`.

    **Approve pada step non-final** (data legacy): maju ke step berikutnya,
    notifikasi `kepala_desa_approved` ke approver berikutnya.

    **Reject**: `rejected`, `rejected_at_step` dicatat (terminal),
    notifikasi `kepala_desa_rejected` ke pemohon.
  operationId: decideKadesLetter
  security:
    - sanctumCookie: []
  parameters:
    - name: letter
      in: path
      required: true
      schema:
        type: string
        format: uuid
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../schemas/letters/letters.yaml#/DecisionRequest'
  responses:
    '200':
      description: Keputusan tersimpan
      content:
        application/json:
          schema:
            $ref: '../../schemas/letters/letters.yaml#/DecisionResponse'
    '401':
      $ref: '../../responses/common.yaml#/Unauthenticated'
    '403':
      description: Bukan Kades/Sekdes aktif, beda desa, atau surat milik sendiri
      content:
        application/json:
          schema:
            $ref: '../../schemas/common/errors.yaml#/ForbiddenResponse'
    '404':
      $ref: '../../responses/common.yaml#/NotFound'
    '409':
      description: Surat tidak di tahap Kepala Desa, sudah diproses, atau sudah diputuskan Kades/Sekdes lain
      content:
        application/json:
          schema:
            $ref: '../../schemas/common/errors.yaml#/ConflictResponse'
          example:
            message: "Surat ini sudah diproses oleh Kepala Desa/Sekdes lain sebelum Anda."
    '422':
      description: Reject tanpa catatan
      content:
        application/json:
          schema:
            $ref: '../../schemas/common/errors.yaml#/ValidationErrorResponse'
