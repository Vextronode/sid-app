patch:
  tags: [Epic 2 - Users, Citizens, Officials]
  summary: Ubah pekerjaan desa
  operationId: updateOccupation
  security:
    - sanctumCookie: []
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../schemas/occupations/occupations.yaml#/OccupationUpdateRequest'
  responses:
    '200':
      description: Pekerjaan berhasil diperbarui
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: '../../schemas/occupations/occupations.yaml#/Occupation'
    '401':
      $ref: '../../responses/common.yaml#/Unauthenticated'
    '403':
      $ref: '../../responses/common.yaml#/Forbidden'
    '404':
      $ref: '../../responses/common.yaml#/NotFound'
    '422':
      description: Input tidak valid atau nama pekerjaan sudah digunakan di desa
      content:
        application/json:
          schema:
            $ref: '../../schemas/common/errors.yaml#/ValidationErrorResponse'
delete:
  tags: [Epic 2 - Users, Citizens, Officials]
  summary: Hapus pekerjaan desa
  description: Pekerjaan yang masih dipakai warga tidak dapat dihapus; gunakan nonaktifkan.
  operationId: deleteOccupation
  security:
    - sanctumCookie: []
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
  responses:
    '200':
      description: Pekerjaan berhasil dihapus
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: "Pekerjaan berhasil dihapus."
    '401':
      $ref: '../../responses/common.yaml#/Unauthenticated'
    '403':
      $ref: '../../responses/common.yaml#/Forbidden'
    '404':
      $ref: '../../responses/common.yaml#/NotFound'
    '409':
      description: Pekerjaan masih dipakai warga
      content:
        application/json:
          schema:
            $ref: '../../schemas/common/errors.yaml#/ConflictResponse'
          example:
            message: "Pekerjaan masih dipakai 3 warga. Nonaktifkan saja bila tidak ingin ditampilkan lagi."
