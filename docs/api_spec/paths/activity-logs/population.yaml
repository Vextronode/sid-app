get:
  tags: [Epic 2 - Users, Citizens, Officials]
  summary: Riwayat perubahan data warga & KK (Log Aktivitas)
  description: |
    S-05. Aktor: Petugas Desa (`staf_sid`). Daftar activity log `citizen` dan
    `family` milik desa akun yang login (disaring lewat `properties.village_id`,
    sehingga data yang sudah dihapus tetap terlihat), terbaru dulu, 20 per
    halaman. Dicatat oleh `PopulationAuditService` saat Petugas menambah,
    mengubah, menghapus, atau mengimpor warga, KK, dan data sosio-ekonomi KK;
    perubahan lewat Terapkan surat tercatat sebagai `letter_fulfilled`.
  operationId: listPopulationActivityLogs
  security:
    - sanctumCookie: []
  parameters:
    - name: type
      in: query
      required: false
      schema:
        type: string
        enum: [citizen, family]
    - name: event
      in: query
      required: false
      schema:
        type: string
        enum: [created, updated, deleted, imported, socioeconomic_updated, letter_fulfilled]
    - name: subject_id
      in: query
      required: false
      description: ID warga atau KK
      schema:
        type: string
    - name: from
      in: query
      required: false
      schema:
        type: string
        format: date
    - name: to
      in: query
      required: false
      description: Harus sama dengan atau setelah `from`
      schema:
        type: string
        format: date
    - name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
  responses:
    '200':
      description: Riwayat data kependudukan
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: "Riwayat data kependudukan berhasil diambil."
              data:
                type: array
                items:
                  $ref: '../../schemas/activity-logs/activity-logs.yaml#/PopulationLog'
              meta:
                $ref: '../../schemas/activity-logs/activity-logs.yaml#/ActivityPageMeta'
    '401':
      $ref: '../../responses/common.yaml#/Unauthenticated'
    '403':
      $ref: '../../responses/common.yaml#/Forbidden'
    '422':
      $ref: '../../responses/common.yaml#/ValidationError'
