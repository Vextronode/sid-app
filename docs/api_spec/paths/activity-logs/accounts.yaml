get:
  tags: [Epic 2 - Users, Citizens, Officials]
  summary: Riwayat tindakan akun (Log Aktivitas)
  description: |
    Aktor: Staf SIDUTama aktif dengan desa. Activity log `user`,
    `password_reset_request`, `account_registration`, dan
    `profile_photo_request` milik desa akun yang login (`properties.village_id`),
    terbaru dulu, berpaginasi (default 20): aktivasi/nonaktif dan ubah akun,
    reset sandi oleh petugas, pemulihan Staf SIDUTama, keputusan permintaan
    atur ulang sandi dan ganti foto, serta keputusan/aktivasi manual
    pendaftaran akun.
  operationId: listAccountActivityLogs
  security:
    - sanctumCookie: []
  parameters:
    - name: event
      in: query
      required: false
      schema:
        type: string
        enum: [activated, deactivated, updated, password_reset_by_staff, staf_sid_recovered, approved, rejected, registration_approved, registration_rejected, registration_manual_activated]
    - name: from
      in: query
      required: false
      schema: { type: string, format: date }
    - name: to
      in: query
      required: false
      description: Harus sama dengan atau setelah `from`
      schema: { type: string, format: date }
    - name: page
      in: query
      required: false
      schema: { type: integer, minimum: 1 }
    - name: per_page
      in: query
      required: false
      description: Default 20, maksimum 100.
      schema: { type: integer, minimum: 1, maximum: 100 }
  responses:
    '200':
      description: Riwayat tindakan akun
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: "Riwayat tindakan akun berhasil diambil."
              data:
                type: array
                items:
                  $ref: '../../schemas/activity-logs/activity-logs.yaml#/AccountLog'
              meta:
                $ref: '../../schemas/activity-logs/activity-logs.yaml#/ActivityPageMeta'
    '401':
      $ref: '../../responses/common.yaml#/Unauthenticated'
    '403':
      $ref: '../../responses/common.yaml#/Forbidden'
    '422':
      $ref: '../../responses/common.yaml#/ValidationError'
