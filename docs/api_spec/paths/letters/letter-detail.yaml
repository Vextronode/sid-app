get:
  tags: [Epic 5 - Alur Pengajuan & Approval Surat]
  summary: Lihat detail & timeline status surat
  description: |
    UC-06. Menampilkan detail data pemohon, status generik dengan badge,
    indikator tahap aktif (derived dari current_step_order + JOIN
    flow_steps, bukan lagi status granular RT/RW/Kadus/Kasi terpisah),
    informasi approval per tahap, dan timeline riwayat lengkap
    (letter_status_logs). Menyertakan `rw_fyi_notified` sebagai indikator
    apakah notifikasi FYI ke RW sudah terkirim (RW tidak pernah punya
    row di approvals).
  operationId: getLetterDetail
  security:
    - sanctumCookie: []
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
      example: 501
  responses:
    '200':
      description: Detail surat berhasil diambil
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: '../../schemas/letters/letters.yaml#/LetterDetail'
          example:
            data:
              id: 501
              status: "in_progress"
              current_step_order: 2
              current_step: { step_order: 2, approver_position: "kepala_desa", is_final: false }
              rw_fyi_notified: true
              is_overdue: false
              applicant_name: "Siti Aminah"
              applicant_nik_masked: "************0001"
              approvals:
                - approval_level: "rt"
                  action: "approved"
                  approver_name: "Pak RT Ujang"
                  flow_step_id: 12
                  created_at: "2026-07-01T14:00:00Z"
              status_logs:
                - new_status: "pending"
                  created_at: "2026-07-01T09:00:00Z"
                - old_status: "pending"
                  new_status: "in_progress"
                  created_at: "2026-07-01T14:00:00Z"
    '401':
      $ref: '../../responses/common.yaml#/Unauthenticated'
    '403':
      description: Surat bukan milik/wewenang user ini
      content:
        application/json:
          schema:
            $ref: '../../schemas/common/errors.yaml#/ForbiddenResponse'
    '404':
      $ref: '../../responses/common.yaml#/NotFound'
