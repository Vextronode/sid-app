post:
  tags: [Epic 5 - Alur Pengajuan & Approval Surat]
  summary: Ganti saksi yang menolak/kedaluwarsa (pemohon)
  description: |
    Hanya pemohon surat. Surat harus `pending` dengan `current_step_order = 0`
    (menunggu persetujuan saksi). Permintaan yang masih menunggu pada slot itu
    dibatalkan (`cancelled`), lalu NIK baru dicatat ulang:
    - warga desa ber-akun: permintaan persetujuan baru (berlaku
      `config/letters.php` `request_ttl_days`, default 3 hari); ditolak bila NIK
      milik pemohon, pemohon diblokir pemilik NIK, atau sudah ditolak
      `max_rejections` kali (default 3) dalam `rejection_window_hours`;
    - warga desa tanpa akun: tercatat untuk diverifikasi RT;
    - di luar data penduduk: wajib `name` (dan opsional `family_number`).
    Setelah semua saksi terisi, surat otomatis masuk step approval pertama.
    Tidak ada tanda tangan digital maupun unggah TTD basah.
  operationId: refillLetterSignatureSlot
  security:
    - sanctumCookie: []
  parameters:
    - name: letter
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: slot
      in: path
      required: true
      description: "Nama isian NIK saksi (isian ber-`witness` di `form_fields`)."
      schema:
        type: string
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../schemas/letters/letters.yaml#/SignatureRefillRequest'
  responses:
    '200':
      description: Slot diperbarui
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: "Saksi diperbarui."
              data:
                $ref: '../../schemas/letters/letters.yaml#/LetterSignature'
    '401':
      $ref: '../../responses/common.yaml#/Unauthenticated'
    '403':
      description: Bukan pemohon surat
    '404':
      description: Saksi tidak ditemukan
    '409':
      description: Surat tidak sedang menunggu persetujuan saksi, atau saksi sudah menyetujui
    '422':
      $ref: '../../responses/common.yaml#/ValidationError'
