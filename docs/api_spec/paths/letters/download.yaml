get:
  tags: [Epic 5 - Alur Pengajuan & Approval Surat]
  summary: Download PDF surat
  description: |
    UC-08. LetterPolicy::download: surat harus `approved`; boleh diunduh oleh
    pemohon, Staf SIDUTama / Kepala Desa / Sekretaris Desa di desa yang sama,
    dan Kasi/Kaur di desa yang sama sesuai `assigned_role` (NULL = keduanya).
    Pemohon ditolak bila `expires_at` sudah lewat.

    PDF dirender on-demand (dompdf) dan tidak disimpan. Surat approved
    dirender dari **snapshot** yang dibekukan saat final approve
    (`letters.snapshot`: template, definisi isian, kop/identitas desa,
    stempel, nama & TTD Kepala Desa yang menjabat saat itu, tanggal terbit).
    Surat approved lama tanpa snapshot dibekukan saat unduhan pertama
    (memerlukan Kepala Desa aktif). TTD/stempel dibaca dari private storage.
  operationId: downloadLetterPdf
  security:
    - sanctumCookie: []
  parameters:
    - name: letter
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: template
      in: query
      required: false
      description: "`digital` menempelkan TTD Kepala Desa dan stempel desa; selain itu (default `wet`) area tanda tangan dikosongkan (tanpa TTD dan stempel) untuk dicetak lalu ditandatangani dan distempel basah."
      schema:
        type: string
        enum: [wet, digital]
        default: wet
    - name: document
      in: query
      required: false
      description: "Kunci dokumen dari `Letter.documents` (dokumen yang terbit bersama surat). Kosong/`main` = dokumen utama. 404 bila dokumen tidak terbit untuk surat ini (syarat `when` tidak terpenuhi) atau tidak dikenal."
      schema:
        type: string
        default: main
  responses:
    '200':
      description: File PDF (attachment `surat-{id}.pdf`, atau `surat-{id}-{document}.pdf` untuk dokumen yang terbit bersama)
      content:
        application/pdf:
          schema:
            type: string
            format: binary
    '401':
      $ref: '../../responses/common.yaml#/Unauthenticated'
    '403':
      description: Belum approved, masa berlaku habis (pemohon), atau Policy menolak
      content:
        application/json:
          schema:
            $ref: '../../schemas/common/errors.yaml#/ForbiddenResponse'
          examples:
            expired_for_applicant:
              value:
                message: "Masa berlaku surat telah habis."
    '404':
      description: Surat tidak ditemukan, atau belum ada Kepala Desa aktif untuk membekukan snapshot
    '500':
      description: Data penanda tangan snapshot tidak ditemukan atau template tidak ada
