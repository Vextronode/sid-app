get:
  tags: [Epic 5 - Alur Pengajuan & Approval Surat]
  summary: Download PDF surat (generate on-demand)
  description: |
    UC-08. Trigger status generik `approved` (BUKAN lagi `kasi_approved` -
    ENUM granular sudah dihapus total di v5.0). PDF digenerate on-demand
    (barryvdh/laravel-dompdf) saat request, tidak disimpan di server
    (keputusan final struktural, SID-ARCH-BE-001 S6 - bukan sekadar hemat
    storage, tapi menghindari PDF stale jika data surat berubah setelah
    digenerate). TTD & stempel diambil dari officials (Kades aktif:
    is_active=true AND ended_at IS NULL). Untuk role warga, dicek
    expires_at bagi pemohon (`submitted_by = user.id`) tanpa membedakan
    role. Kasi/Kaur juga wajib sesuai assigned_role. TTD dan stempel selalu
    berasal dari Kepala Desa aktif, termasuk bila Sekdes yang menyetujui.
  operationId: downloadLetterPdf
  security:
    - sanctumCookie: []
  parameters:
    - name: letter
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    '200':
      description: File PDF berhasil digenerate dan di-stream sebagai response
      content:
        application/pdf:
          schema:
            type: string
            format: binary
    '401':
      $ref: '../../responses/common.yaml#/Unauthenticated'
    '403':
      description: Status belum approved, pemohon telah melewati expires_at, atau Policy menolak
      content:
        application/json:
          schema:
            $ref: '../../schemas/common/errors.yaml#/ForbiddenResponse'
          examples:
            not_final:
              summary: Surat belum berstatus approved
              value:
                message: "Surat baru dapat diunduh setelah seluruh proses persetujuan selesai."
            expired_for_applicant:
              summary: Pemohon mencoba download setelah masa berlaku habis
              value:
                message: "Masa berlaku surat telah habis."
    '404':
      $ref: '../../responses/common.yaml#/NotFound'
    '500':
      description: Gagal generate PDF (misal TTD/stempel Kades belum tersedia)
      content:
        application/json:
          schema:
            $ref: '../../schemas/common/errors.yaml#/ServerErrorResponse'
