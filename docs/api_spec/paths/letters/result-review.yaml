patch:
  tags: [Epic 5 - Alur Pengajuan & Approval Surat]
  summary: Verifikasi hasil dari instansi luar
  description: |
    LetterPolicy::reviewResult: `result_stage = under_review`, desa yang
    sama, aktor Kasi/Kaur sesuai `assigned_role` (NULL = keduanya),
    termasuk hasil suratnya sendiri (log "oleh pemohon sendiri"); Staf
    SIDUTama tidak memverifikasi. Hanya unggahan terakhir yang dapat
    diputus. `accepted` membuka Terapkan (`needs_fulfillment`) bila jenis
    surat memiliki `data_action`; `rejected` mengembalikan tahap ke
    `awaiting_upload` sehingga pemohon dapat mengunggah ulang. Pemohon
    menerima notifikasi `letter_result_accepted` / `letter_result_rejected`.
  operationId: reviewLetterResult
  security:
    - sanctumCookie: []
  parameters:
    - name: letter
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: result
      in: path
      required: true
      schema:
        type: integer
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required: [decision]
          properties:
            decision:
              type: string
              enum: [accepted, rejected]
            notes:
              type: string
              nullable: true
              maxLength: 500
              description: Wajib bila `decision = rejected`.
  responses:
    '200':
      description: Verifikasi tersimpan
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: "Hasil dari instansi diterima."
              data:
                $ref: '../../schemas/letters/letters.yaml#/LetterResult'
    '401':
      $ref: '../../responses/common.yaml#/Unauthenticated'
    '403':
      $ref: '../../responses/common.yaml#/Forbidden'
    '404':
      $ref: '../../responses/common.yaml#/NotFound'
    '409':
      description: Unggahan ini sudah diverifikasi atau bukan unggahan terakhir
    '422':
      $ref: '../../responses/common.yaml#/ValidationError'
