get:
  tags: [Epic 5 - Alur Pengajuan & Approval Surat]
  summary: Preview PDF surat (inline) sesuai kewenangan view
  description: |
    Diotorisasi LetterPolicy::view. **Pemohon** (akun pengaju atau warga
    pemohon) hanya dapat mem-preview setelah surat `approved` (403
    "Pratinjau surat tersedia setelah surat terbit."); pejabat yang memutus
    atau memantau (RT, RW, Kadus, Kades/Sekdes) dapat mem-preview selama
    proses. Surat yang belum approved dirender dari data hidup dengan
    Kepala Desa aktif saat ini; surat approved dirender dari snapshot.
    Di-stream inline (`surat-{id}.pdf`).

    PDF tidak memuat gambar tanda tangan maupun stempel (dibubuhkan basah
    setelah dicetak di kantor desa). FE menampilkan pratinjau
    sebagai canvas di dalam popup (bukan viewer PDF browser), sehingga
    tidak ada tombol unduh/cetak dari pratinjau.

    Pemohon ditolak (403 "Masa berlaku surat telah habis.") bila
    `expires_at` sudah lewat, sama seperti download; surat tetap tampil
    sebagai riwayat. Pejabat dan Staf SIDUTama tetap dapat mem-preview.
  operationId: previewLetterPdf
  security:
    - sanctumCookie: []
  parameters:
    - name: letter
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: document
      in: query
      required: false
      description: "Kunci dokumen dari `Letter.documents` (dokumen yang terbit bersama surat). Kosong/`main` = dokumen utama. 404 bila dokumen tidak terbit untuk surat ini (syarat `when` tidak terpenuhi) atau tidak dikenal."
      schema:
        type: string
        default: main
  responses:
    '200':
      description: PDF preview
      content:
        application/pdf:
          schema:
            type: string
            format: binary
    '401':
      $ref: '../../responses/common.yaml#/Unauthenticated'
    '403':
      description: Tidak berhak melihat surat, atau pemohon dengan surat kedaluwarsa
      content:
        application/json:
          schema:
            $ref: '../../schemas/common/errors.yaml#/ErrorResponse'
          example:
            message: "Masa berlaku surat telah habis."
    '404':
      description: Surat tidak ditemukan atau belum ada Kepala Desa aktif
