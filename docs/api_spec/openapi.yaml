openapi: 3.0.3

info:
  title: Sistem Informasi Desa (SID) - SIDUTama REST API
  version: "5.3.0"
  description: |
    Spesifikasi API SIDUTama, diselaraskan ke source backend aktif
    (`apps/backend/routes/api.php`, `routes/auth.php`, controller, form
    request, resource, policy, dan service) per 2026-10-16. Bila ada
    perbedaan antara dokumen ini dan source, source yang berlaku.

    ## Perubahan v5.3 — Surat dinamis, tanda tangan, identitas desa

    - **Kategori surat dihapus.** Tabel `letter_categories`, kolom
      `letter_types.category_id`/`approval_flows.category_id`, dan
      `letter_types.verification_type` sudah di-drop. Endpoint
      `/letter-categories`, `POST /approval-flows`, dan
      `PUT /approval-flows/{id}/steps` tidak ada lagi; flow hanya dibaca.
    - **Jenis surat data-driven (developer via seeder):** `form_fields`
      (isian form dinamis + validasi server), `data_action`/`data_fields`
      (perubahan data kependudukan pasca-approve), `signature_slots`,
      `supporting_template`, `classification_code`, `produces_letter`.
    - **Surat:** pengajuan multipart (isian file, penanda tangan), daftar
      berpaginasi (`LetterListItem` + `meta`), `GET /letters/summary`,
      lampiran privat, dokumen pendukung, isi ulang slot TTD, Terapkan
      (`/letters/{letter}/fulfillment`), snapshot render saat final approve,
      nomor surat per kode klasifikasi (`470/001/Des/X/2026`).
    - **Tanda tangan pribadi akun** (`/profile/signature`), permintaan TTD
      lintas warga (`/signature-requests`), blokir (`/signature-blocks`),
      reset oleh Petugas Desa (`/users/{user}/signature/reset`).
    - **Web Push** (`/push-subscriptions`) di samping notifikasi in-app.
    - **Jabatan desa dinamis:** jenis jabatan tanpa akun
      (`/official-position-types`), `officials.position` VARCHAR, foto
      pejabat wajib saat penetapan, pencarian calon via NIK.
    - **Kategori berita** (`/news-categories`, berita wajib 1-2 kategori).
    - **Identitas desa dari DB:** kop surat (kecamatan, kabupaten, provinsi,
      kode pos, email), luas wilayah, logo & foto beranda (upload,
      dioptimasi WebP), jam layanan, titik kantor (`latitude`/`longitude`,
      bisa diisi dari link Google Maps), sambutan Kepala Desa. Halaman publik
      di-cache per desa dan menyajikan statistik serta perangkat desa.
    - **Pengumuman beranda** (`/announcement`, satu per desa, durasi wajib,
      dihapus otomatis) dan **halaman informasi** (`/info-pages`: PPID,
      Kebijakan Privasi, Aksesibilitas).
    - **Register** mewajibkan `date_of_birth` yang cocok dengan data warga.
    - **Daftar warga** berpaginasi dengan pencarian & filter RT.

    Endpoint web auth (/login, /register, /logout, /forgot-password,
    /reset-password, /verify-email, /email/verification-notification)
    tidak memakai prefix `/api`; endpoint bisnis memakai prefix `/api`.

    Autentikasi: Laravel Sanctum SPA cookie-based. Route terproteksi memakai
    middleware `auth:sanctum`, `account.active` (403 `account_inactive`),
    dan `password.changed` (403 `password_change_required`), plus `role:`
    per grup; otorisasi konteks per resource tetap di Policy/Service.

    Scope eksklusi eksplisit: QR Verification dan Void/Cancel Surat tidak
    ada di API ini.
  contact:
    name: Tim SID
  license:
    name: Proprietary - Internal Use Only
    url: https://sid-cibenda.id/license

servers:
  - url: /api
    description: Endpoint bisnis (relatif terhadap origin backend)

security:
  - sanctumCookie: []

tags:
  - name: Infrastruktur
    description: Endpoint kesehatan, CSRF, storage, dan root aplikasi.
  - name: Epic 1 - Struktur Wilayah
    description: CRUD Dusun / RW / RT. UC-20.
  - name: Epic 2 - Users, Citizens, Officials
    description: |
      Data warga & KK, sosio-ekonomi KK, katalog pekerjaan, akun, jabatan
      (promote/demote/rotate, jenis jabatan tanpa akun, foto & TTD jabatan),
      reset password dan reset TTD akun. UC-09, UC-14.
  - name: Epic 3 - Autentikasi
    description: Login, Logout, Register, profil & ganti password. UC-01, UC-02, UC-17.
  - name: Epic 4 - Konfigurasi Tipe Surat & Pipeline Approval
    description: Baca/ubah sederhana jenis surat (UC-21) dan baca flow approval.
  - name: Epic 5 - Alur Pengajuan & Approval Surat
    description: |
      Pengajuan surat, tanda tangan pihak terkait, keputusan RT dan
      Kades/Sekdes, daftar/ringkasan/detail, lampiran, PDF, dokumen
      pendukung, Terapkan perubahan data. UC-03..UC-08, UC-25, UC-26.
  - name: Epic 6 - Sistem Notifikasi
    description: Notifikasi in-app (database) dan Web Push.
  - name: Epic 7 - Deadline & Reminder Approval
    description: Setting deadline & pengingat per level approver. UC-22. Pengingat dikirim scheduler (approvals:send-reminders) reminder_hours sebelum deadline.
  - name: Epic 8 - Dashboard & Statistik
    description: Dashboard adaptif per role. UC-15.
  - name: Epic 9 - Halaman Publik & Konten
    description: Halaman publik, profil desa, berita & kategori, peraturan. UC-16, UC-18, UC-19, UC-24.
  - name: Epic 10 - Organisasi Non-Struktural Desa
    description: BPD/BUMDES/LPM/Karang Taruna/PKK. UC-23.

components:
  securitySchemes:
    sanctumCookie:
      type: apiKey
      in: cookie
      name: laravel_session
      description: |
        Laravel Sanctum SPA cookie-based authentication (HttpOnly). Request
        mutasi wajib menyertakan header X-XSRF-TOKEN dari cookie XSRF-TOKEN.

