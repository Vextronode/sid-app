Letter:
  type: object
  description: |
    Bentuk `LetterResource` (detail surat, respons submit, respons Terapkan).
    `status` generik; posisi "sedang di step mana" dibaca dari
    `current_step_order` + `current_step` (di-JOIN ke flow_steps), bukan dari
    nama status. `current_step_order = 0` berarti surat masih menunggu tanda
    tangan pihak terkait (lihat `awaiting_signatures`) dan belum masuk ke
    approver mana pun.
  properties:
    id:
      type: string
      format: uuid
    village_id:
      type: string
      format: uuid
      example: "0b7a9c52-3d1e-4f6a-8b2c-5e9d1a7f3c40"
    letter_type_id:
      type: integer
      example: 1
    submitted_by:
      type: string
      format: uuid
    on_behalf_of:
      type: string
      format: uuid
      nullable: true
      example: null
      description: "Selalu NULL di MVP - dipersiapkan untuk future use case"
    citizen_id:
      type: string
      format: uuid
      nullable: true
      example: "5f2d8a91-6c3b-4e7d-9a14-b8e0c2d5f731"
    letter_number:
      type: string
      nullable: true
      example: "470/001/Des/X/2026"
      description: |
        Diisi saat final approve dengan format
        `{classification_code}/{urut 3 digit}/Des/{bulan Romawi}/{tahun}`.
        Nomor urut dihitung per desa + kode klasifikasi + tahun.
    applicant_name:
      type: string
      example: "Siti Aminah"
    applicant_nik_masked:
      type: string
      nullable: true
      example: "************0001"
      description: "NIK pemohon tidak pernah dikirim plaintext."
    purpose:
      type: string
      nullable: true
      example: null
      description: |
        Kolom legacy. Pengajuan baru selalu mengisi NULL; keperluan yang
        dibutuhkan sebuah jenis surat menjadi isian di `payload`.
    payload:
      type: object
      nullable: true
      additionalProperties: true
      description: |
        Isian form sesuai `letter_types.form_fields` (kunci = `name` isian).
        Isian bertipe `file` tidak ada di sini; berkasnya tercatat di `attachments`.
      example:
        nama_usaha: "Warung Sembako Berkah"
        alamat_usaha: "Dusun Patrol RT 001/RW 001"
    notes:
      type: string
      nullable: true
      example: null
      description: "Kolom legacy; pengajuan baru selalu NULL."
    status:
      type: string
      enum: [pending, in_progress, approved, rejected]
      example: "pending"
      description: |
        pending: belum ada keputusan approver (termasuk saat menunggu tanda tangan).
        in_progress: minimal 1 step approve, belum sampai step is_final=true.
        approved: step is_final=true sudah di-approve.
        rejected: TERMINAL, rejected_at_step dicatat.
    flow_id:
      type: integer
      example: 1
      description: "Snapshot dari letter_types.flow_id saat submit, dikunci (bukan live-reference)."
    current_step_order:
      type: integer
      example: 1
      description: "step_order yang sedang aktif/ditunggu; 0 = menunggu tanda tangan pihak terkait."
    current_step:
      $ref: '#/CurrentStep'
    rejected_at_step:
      type: integer
      nullable: true
      example: null
    is_overdue:
      type: boolean
      example: false
      description: |
        Dihitung saat daftar dimuat: true bila deadline approval pending
        pada step aktif terlewati. Pada detail surat nilainya adalah nilai
        tersimpan di kolom.
    expires_at:
      type: string
      format: date-time
      nullable: true
      example: null
      description: |
        Dicap saat final approve dari `letter_types.validity_days`
        (NULL = berlaku tanpa batas). Perubahan masa berlaku jenis surat
        tidak mengubah surat yang sudah approved.
    is_expired:
      type: boolean
      example: false
      description: |
        true bila `expires_at` sudah lewat. Pemohon tidak lagi dapat
        mengunduh maupun mem-preview PDF surat ini (403); surat tetap
        tampil sebagai riwayat. Pejabat dan Petugas Desa tetap dapat
        membukanya.
    submitted_at:
      type: string
      format: date-time
      example: "2026-10-01T09:00:00Z"
    processed_at:
      type: string
      format: date-time
      nullable: true
      example: null
    signed_by_official_id:
      type: integer
      nullable: true
      example: 3
      description: "Kepala Desa yang TTD-nya dibekukan pada snapshot saat final approve."
    fulfilled_at:
      type: string
      format: date-time
      nullable: true
      example: null
      description: "Waktu perubahan data kependudukan diterapkan (Terapkan) oleh Kasi/Kaur/Petugas Desa."
    fulfilled_by:
      type: string
      format: uuid
      nullable: true
      example: null
    needs_fulfillment:
      type: boolean
      example: false
      description: |
        Hanya ada bila relasi letterType dimuat. True bila surat approved,
        jenis suratnya memiliki `data_action` selain `none`, dan belum diterapkan.
        Untuk jenis `requires_result_upload`, baru true setelah hasil dari
        instansi diterima (`result_stage = accepted`).
    awaiting_signatures:
      type: boolean
      example: false
      description: "status = pending dan current_step_order = 0."
    documents:
      type: array
      description: |
        Hanya ada bila relasi letterType dimuat. Dokumen yang terbit untuk
        surat ini: dokumen utama (`key: main`, judul = nama jenis surat)
        lalu dokumen dari `letter_types.documents` yang syarat `when`-nya
        terpenuhi jawaban form. Surat approved memakai daftar yang
        dibekukan di snapshot. Unduh/pratinjau lewat `?document={key}`.
      items:
        type: object
        properties:
          key:
            type: string
            example: "main"
          title:
            type: string
            example: "Formulir Pindah"
    result_stage:
      type: string
      nullable: true
      enum: [awaiting_upload, under_review, accepted, null]
      description: |
        Tahap unggah hasil dari instansi luar setelah terbit; null bila
        jenis surat tidak `requires_result_upload` atau surat belum approved.
        Juga dikirim di baris daftar surat.
    result_upload_hint:
      type: string
      nullable: true
      description: "Berkas yang perlu diunggah pemohon, mis. 'KK terbaru dari Disdukcapil'."
    results:
      type: array
      description: Riwayat unggahan hasil (lama ke baru), hanya di detail.
      items:
        $ref: '#/LetterResult'
    can_upload_result:
      type: boolean
      description: "Pengguna saat ini boleh mengunggah hasil (LetterPolicy::uploadResult)."
    can_review_result:
      type: boolean
      description: "Pengguna saat ini boleh memverifikasi hasil (LetterPolicy::reviewResult)."
    has_supporting_document:
      type: boolean
      example: false
      description: "Hanya ada bila relasi letterType dimuat. True bila jenis surat memiliki `supporting_template`."
    rw_fyi_notified:
      type: boolean
      example: true
      description: |
        Hanya ada bila relasi approvals dimuat. True jika ada keputusan
        approve pada level RT; indikator surat melewati tahap RT, bukan bukti
        keberhasilan pengiriman notifikasi FYI.
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time
    citizen:
      description: "Included when relation is loaded"
      allOf:
        - $ref: '../citizens/citizens.yaml#/Citizen'
    letter_type:
      description: |
        Included when relation is loaded. Pada detail surat backend hanya
        memuat kolom id, name, code, assigned_role, produces_letter,
        data_action, form_fields, signature_slots, supporting_template,
        issues_letter_number, signed_by_village_head.
      allOf:
        - $ref: '../letter-types/letter-types.yaml#/LetterType'
    approvals:
      type: array
      items:
        $ref: '#/LetterApproval'
    status_logs:
      type: array
      items:
        $ref: '#/LetterStatusLog'
    attachments:
      type: array
      items:
        $ref: '#/LetterAttachment'
    signatures:
      type: array
      description: "Keadaan terkini tiap slot tanda tangan (baris terbaru per slot)."
      items:
        $ref: '#/LetterSignature'
    user:
      description: "Included when relation is loaded"
      allOf:
        - $ref: '../users/users.yaml#/User'

CurrentStep:
  type: object
  nullable: true
  description: "Step flow yang cocok dengan current_step_order; null bila tidak ada (mis. menunggu tanda tangan)."
  properties:
    step_order:
      type: integer
      example: 1
    approver_position:
      type: string
      enum: [rt, kepala_desa, sekretaris_desa, kasi_pemerintahan, kaur_tu_umum]
      example: "rt"
      description: "Flow seeder hanya memakai rt dan kepala_desa; nilai lain hanya mungkin pada data legacy."
    is_final:
      type: boolean
      example: false

LetterDetail:
  allOf:
    - $ref: '#/Letter'
  description: |
    GET /letters/{id} memuat relasi citizen.rt, letterType (kolom terbatas),
    approvals.approvedBy, flow.steps, statusLogs.actor, attachments, signatures.

LetterListItem:
  type: object
  description: |
    Bentuk ringkas `LetterListResource` untuk GET /letters (daftar berpaginasi).
    Tidak memuat payload, lampiran, tanda tangan, maupun riwayat.
  properties:
    id:
      type: string
      format: uuid
    letter_type_id:
      type: integer
    submitted_by:
      type: string
      format: uuid
    citizen_id:
      type: string
      format: uuid
      nullable: true
    letter_number:
      type: string
      nullable: true
    applicant_name:
      type: string
    notes:
      type: string
      nullable: true
    status:
      type: string
      enum: [pending, in_progress, approved, rejected]
    current_step_order:
      type: integer
    current_step:
      $ref: '#/CurrentStep'
    rejected_at_step:
      type: integer
      nullable: true
    is_overdue:
      type: boolean
    awaiting_signatures:
      type: boolean
    needs_fulfillment:
      type: boolean
    expires_at:
      type: string
      format: date-time
      nullable: true
    is_expired:
      type: boolean
    submitted_at:
      type: string
      format: date-time
    processed_at:
      type: string
      format: date-time
      nullable: true
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time
    letter_type:
      type: object
      nullable: true
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "Surat Keterangan Usaha"
        code:
          type: string
          example: "A01"
        signed_by_village_head:
          type: boolean
          example: true
    citizen:
      type: object
      nullable: true
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: "Siti Aminah"

LetterListResponse:
  type: object
  properties:
    message:
      type: string
      example: "Daftar surat berhasil diambil."
    data:
      type: array
      items:
        $ref: '#/LetterListItem'
    meta:
      $ref: '../common/errors.yaml#/PaginationMeta'

LetterSummary:
  type: object
  description: |
    Ringkasan angka atas scope yang sama persis dengan GET /letters (per
    role/wilayah, atau scope=mine). Filter tampilan (status, search, dst)
    tidak diterapkan pada ringkasan.
  properties:
    total:
      type: integer
      example: 42
    by_status:
      type: object
      properties:
        pending:
          type: integer
          example: 5
        in_progress:
          type: integer
          example: 3
        approved:
          type: integer
          example: 30
        rejected:
          type: integer
          example: 4
    overdue:
      type: integer
      example: 1
    by_type:
      type: array
      items:
        type: object
        properties:
          id:
            type: integer
            example: 1
          name:
            type: string
            nullable: true
            example: "Surat Keterangan Usaha"
          total:
            type: integer
            example: 12
    by_period:
      type: object
      description: "Kunci day (sejak awal hari), week (sejak Senin minggu kalender berjalan, Senin-Minggu, sama dengan /dashboard/letter-stats), month (sejak awal bulan)."
      additionalProperties:
        type: object
        properties:
          total:
            type: integer
          pending:
            type: integer
          in_progress:
            type: integer
          approved:
            type: integer
          rejected:
            type: integer

LetterApproval:
  type: object
  description: |
    Row dibuat saat suatu step mulai menunggu keputusan dengan approved_by
    dan action null, lalu diperbarui saat keputusan dicatat. RW dan Kadus
    tidak pernah membuat row (FYI saja).
  properties:
    id:
      type: integer
      example: 901
    letter_id:
      type: string
      format: uuid
    approved_by:
      type: string
      format: uuid
      nullable: true
    approver_name:
      type: string
      nullable: true
      example: "Pak RT Ujang"
    approved_by_user:
      description: "Included when relation approvedBy is loaded"
      allOf:
        - $ref: '../users/users.yaml#/User'
    approval_level:
      type: string
      enum: [rt, kepala_desa, sekretaris_desa, kasi_pemerintahan, kaur_tu_umum]
      example: "rt"
      description: "Level step untuk row pending; setelah keputusan berisi posisi aktor sebenarnya (sekretaris_desa bila Sekdes yang memutuskan step kepala_desa)."
    flow_step_id:
      type: integer
      nullable: true
      example: 12
    action:
      type: string
      enum: [approved, rejected]
      nullable: true
    notes:
      type: string
      nullable: true
    deadline_at:
      type: string
      format: date-time
      nullable: true
    reminded_at:
      type: string
      format: date-time
      nullable: true
      description: "Waktu pengingat approval dikirim (approvals:send-reminders); NULL bila belum. Juga diisi bila tahap tidak punya pejabat aktif agar tidak dicoba ulang."
    created_at:
      type: string
      format: date-time

LetterStatusLog:
  type: object
  properties:
    id:
      type: integer
      example: 1200
    letter_id:
      type: string
      format: uuid
    actor_id:
      type: string
      format: uuid
    actor_name:
      type: string
      example: "Pak RT Ujang"
    old_status:
      type: string
      enum: [pending, in_progress, approved, rejected]
      nullable: true
    new_status:
      type: string
      enum: [pending, in_progress, approved, rejected]
    notes:
      type: string
      nullable: true
      description: |
        Dipetakan dari kolom `reason`. Nilai sistem yang dipakai antara lain:
        "Permohonan surat dibuat", "Menunggu tanda tangan pihak terkait",
        "Surat ditahan: tahap RT belum memiliki pejabat aktif",
        "Tahap RT dilewati: pemohon adalah pejabat pada tahap tersebut",
        "Perubahan data kependudukan diterapkan".
    ip_address:
      type: string
      nullable: true
    created_at:
      type: string
      format: date-time

LetterAttachment:
  type: object
  description: "Berkas pada disk privat; dibuka lewat `url` yang memeriksa hak lihat surat."
  properties:
    id:
      type: integer
      example: 15
    kind:
      type: string
      enum: [attachment, field, wet_signature]
      example: "field"
      description: |
        field: berkas isian bertipe file pada form; wet_signature: foto dokumen
        ber-TTD basah untuk sebuah slot; attachment: lampiran umum (tidak dibuat
        oleh alur pengajuan saat ini).
    field:
      type: string
      nullable: true
      example: "foto_usaha"
      description: "Nama isian (kind=field) atau slot_key (kind=wet_signature)."
    original_name:
      type: string
      example: "foto-warung.jpg"
    mime_type:
      type: string
      example: "image/jpeg"
    size:
      type: integer
      example: 204800
    url:
      type: string
      example: "/api/letters/9b1d.../attachments/15"
    created_at:
      type: string
      format: date-time

LetterSignature:
  type: object
  description: "Keadaan terkini satu slot tanda tangan pada surat (`letter_types.signature_slots`)."
  properties:
    slot_key:
      type: string
      example: "saksi_1"
    slot_label:
      type: string
      example: "Saksi 1"
    signer_type:
      type: string
      enum: [applicant, other, witness]
      description: "`witness` = saksi dari isian NIK ber-`witness` (persetujuan, tanpa TTD); slot_key = nama isian NIK."
    method:
      type: string
      enum: [digital, wet, consent, rt_check, manual]
      description: |
        Saksi: `consent` = disetujui pemilik NIK lewat akun; `rt_check` =
        warga desa tanpa akun (nama dari data penduduk, diverifikasi RT);
        `manual` = di luar data penduduk (nama diketik pemohon).
    status:
      type: string
      enum: [pending, signed, rejected, expired, cancelled]
      description: "pending yang sudah lewat expires_at dilaporkan sebagai expired."
    signer_name:
      type: string
      nullable: true
      description: "Hanya diisi bila status signed."
    expires_at:
      type: string
      format: date-time
      nullable: true
      description: "Hanya diisi bila status pending."
    responded_at:
      type: string
      format: date-time
      nullable: true

LetterCreateRequest:
  type: object
  description: |
    Dikirim sebagai `multipart/form-data` bila ada berkas, atau JSON bila tidak.
    Data pemohon (nama, NIK, alamat) diambil dari citizen akun yang login.
    Aturan `payload` diturunkan dari `letter_types.form_fields`:
    - jenis surat dengan `form_fields = null` menerima isian bebas (teks maks 2000);
    - jenis surat dengan definisi hanya menerima isian terdaftar; isian tak dikenal → 422.
    Tipe isian: text (maks 255), textarea (maks 2000), date, number, nik (16 digit),
    select (harus salah satu `options.value`), file (dikirim di `files.{name}`).
  required: [letter_type_id]
  properties:
    letter_type_id:
      type: integer
      example: 1
      description: "Jenis surat milik desa pemohon."
    payload:
      type: object
      nullable: true
      additionalProperties: true
      example:
        nama_usaha: "Warung Sembako Berkah"
    files:
      type: object
      nullable: true
      description: "Berkas per isian bertipe file: `files[{name}]`. PDF/JPG/JPEG/PNG (atau JPG/PNG bila `accept: image`), maks 2048 KB."
      additionalProperties:
        type: string
        format: binary
    signers:
      type: object
      nullable: true
      description: |
        Per slot tanda tangan pihak lain: `signers[{slot}][nik]` (16 digit) untuk
        meminta TTD digital pemilik NIK, atau `signers[{slot}][name]` (maks 100)
        bersama `signature_files[{slot}]` untuk TTD basah.
      additionalProperties:
        type: object
        properties:
          nik:
            type: string
            pattern: '^\d{16}$'
          name:
            type: string
            maxLength: 100
    signature_files:
      type: object
      nullable: true
      description: "Foto dokumen ber-TTD basah per slot. PDF/JPG/JPEG/PNG, maks 2048 KB."
      additionalProperties:
        type: string
        format: binary

DecisionRequest:
  type: object
  required: [status]
  properties:
    status:
      type: string
      enum: [approved, rejected]
      example: "approved"
    notes:
      type: string
      nullable: true
      example: null
      description: "Wajib diisi jika status = rejected"

DecisionResponse:
  type: object
  properties:
    message:
      type: string
      example: "Surat berhasil diproses."

LetterResult:
  type: object
  description: Satu unggahan hasil dari instansi luar.
  properties:
    id:
      type: integer
      example: 1
    status:
      type: string
      enum: [submitted, accepted, rejected]
    submitted_at:
      type: string
      format: date-time
    reviewed_at:
      type: string
      format: date-time
      nullable: true
    reviewer_name:
      type: string
      nullable: true
    review_notes:
      type: string
      nullable: true
    attachments:
      type: array
      items:
        $ref: '#/LetterAttachment'

FulfillmentProposal:
  type: object
  description: "Bahan tinjauan sebelum Terapkan: tiap kolom dengan nilai sekarang dan nilai usulan."
  properties:
    action:
      type: string
      enum: [none, update_citizen, create_citizen, deactivate_members, update_members, manual]
      example: "update_citizen"
    fulfilled_at:
      type: string
      format: date-time
      nullable: true
    fulfilled_by:
      type: string
      format: uuid
      nullable: true
    result:
      type: object
      nullable: true
      description: |
        Isi `letters.fulfillment` setelah diterapkan. update/create_citizen:
        {action, citizen_id, changes{kolom:{old,new}}}; deactivate_members:
        {action, members[{citizen_id, name, changes}]}; manual: {action, notes}.
    member_changes:
      type: array
      description: |
        Untuk action `update_members`: per anggota (indeks baris repeater)
        kolom yang diminta berubah: {column, label, current, current_label,
        proposed, proposed_label, needs_choice}. `needs_choice` = pekerjaan
        "Lainnya" tanpa id katalog; Kasi/Kaur memilih dari `options`.
      items:
        type: object
    options:
      type: object
      description: "Untuk action `update_members`: pilihan nilai per kolom (last_education, religion, marital_status, occupation_id)."
    instructions:
      type: string
      nullable: true
      description: "Petunjuk dari `letter_types.data_instructions` (semua action, bila diisi)."
    members:
      type: array
      description: "Untuk action `deactivate_members`: anggota yang dipilih pemohon beserta keadaannya sekarang."
      items:
        type: object
        properties:
          citizen_id:
            type: string
            format: uuid
          name:
            type: string
          family_role:
            type: string
            example: "Anak"
          found:
            type: boolean
          is_active:
            type: boolean
    subject:
      type: object
      nullable: true
      description: "Diisi bila jenis surat punya `data_subject_field` (subjek bukan pemohon, mis. almarhum)."
      properties:
        nik:
          type: string
          nullable: true
        found:
          type: boolean
        name:
          type: string
          nullable: true
    fields:
      type: array
      items:
        type: object
        properties:
          column:
            type: string
            example: "is_active"
          label:
            type: string
            example: "Status data warga"
          source:
            type: string
            nullable: true
            description: "Nama isian payload sumber nilai usulan."
          current:
            description: "Nilai sekarang (hanya untuk update_citizen); tipe bebas, dapat null."
          proposed:
            description: "Nilai usulan; tipe bebas, dapat null."
          fixed:
            type: boolean
            description: "True bila nilai ditetapkan jenis surat dan tidak dapat dikoreksi."
          display:
            type: string
            nullable: true

FulfillmentApplyRequest:
  type: object
  properties:
    values:
      type: object
      nullable: true
      additionalProperties: true
      description: |
        Koreksi per kolom. Hanya kolom pada `data_fields` jenis surat yang tidak
        bernilai tetap; kolom lain → 422. Nilai divalidasi dengan aturan yang sama
        seperti form data warga Petugas Desa.
    notes:
      type: string
      nullable: true
      maxLength: 500
      description: "Catatan \"Tandai selesai\" untuk action `manual`."
    subject_nik:
      type: string
      nullable: true
      pattern: '^\d{16}$'
      description: "Koreksi NIK warga subjek bila subjeknya bukan pemohon."

SignatureRefillRequest:
  type: object
  description: "Salah satu: `nik`, atau `file` + `name`."
  properties:
    nik:
      type: string
      pattern: '^\d{16}$'
    file:
      type: string
      format: binary
      description: "PDF/JPG/JPEG/PNG maks 2048 KB."
    name:
      type: string
      maxLength: 100

SignatureRequest:
  type: object
  description: "Permintaan tanda tangan yang menunggu keputusan pemilik NIK."
  properties:
    id:
      type: integer
      example: 7
    slot_label:
      type: string
      example: "Saksi 1"
    letter_type:
      type: string
      nullable: true
      example: "Surat Keterangan Usaha"
    applicant_name:
      type: string
      example: "Siti Aminah"
    purpose:
      type: string
      nullable: true
    requested_at:
      type: string
      format: date-time
    expires_at:
      type: string
      format: date-time

SignatureBlock:
  type: object
  properties:
    id:
      type: integer
    blocked_user_name:
      type: string
      nullable: true
    blocked_nik_masked:
      type: string
      nullable: true
      example: "************0009"
    created_at:
      type: string
      format: date-time

UserSignatureStatus:
  type: object
  properties:
    has_signature:
      type: boolean
    created_at:
      type: string
      format: date-time
      nullable: true
