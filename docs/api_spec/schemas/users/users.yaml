    rw:
      nullable: true
      description: "Included when relation is loaded"
      $ref: '../wilayah/wilayah.yaml#/Rw'

RotateOfficialResponse:
  type: object
  properties:
    message:
      type: string
      example: "Rotasi jabatan berhasil diproses"
    data:
      type: object
      properties:
        old_official:
          $ref: '#/Official'
        new_official:
          $ref: '#/Official'
    warnings:
      type: array
      items:
        type: object
        properties:
          code:
            type: string
          position:
            type: string
          count:
            type: integer
          message:
            type: string
