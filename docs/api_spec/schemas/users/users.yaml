User:
  type: object
  description: |
    Bentuk `UserResource`. 9 nilai role. `nik` (plaintext) hanya dikirim
    bila resource adalah akun yang sedang login.
  properties:
    id:
      type: string
      format: uuid
    village_id:
      type: string
      format: uuid
      nullable: true
    citizen_id:
      type: string
      format: uuid
      nullable: true
    name:
      type: string
      example: "Ahmad Budiman"
    username:
      type: string
      example: "ahmad.1937"
    role:
      type: string
      enum: [warga, rt, rw, kadus, kasi_pemerintahan, kaur_tu_umum, staf_sid, kepala_desa, sekretaris_desa]
      example: "rt"
    role_label:
      type: string
      nullable: true
      description: |
        Nama peran untuk ditampilkan. `staf_sid` mengikuti nama aplikasi di
        config `sid.app_name` (env SID_APP_NAME), mis. "Staf SIDUTama".
      example: "RT"
    photo_url:
      type: string
      nullable: true
      description: |
        URL foto profil akun warga. Selama akun menjabat, foto yang dipakai
        adalah `official.photo_img` (dikelola Petugas Desa).
      example: null
    email:
      type: string
      nullable: true
    nik:
      type: string
      nullable: true
      description: "Hanya untuk pemilik akun sendiri."
    is_active:
      type: boolean
    must_change_password:
      type: boolean
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time
    citizen:
      description: "Included when relation is loaded"
      allOf:
        - $ref: '../citizens/citizens.yaml#/Citizen'
    official:
      description: "Jabatan aktif; included when relation is loaded"
      allOf:
        - $ref: '#/Official'

UserUpdateRequest:
  type: object
  properties:
    name:
      type: string
      example: "Ahmad Budiman"
    is_active:
      type: boolean
      example: true

OfficialPositionCode:
  type: string
  description: |
    Jabatan berakun (enum `OfficialPosition`): kepala_desa, sekretaris_desa, rt, rw,
    kadus, kasi_pemerintahan, kaur_tu_umum, staf_sid. Selain itu harus
    `code` jenis jabatan tanpa akun yang aktif milik desa
    (`official_position_types`), mis. kasi_kesejahteraan, kaur_keuangan,
    staf_sipades. Kolom `officials.position` kini VARCHAR(50), bukan ENUM.
  example: "rt"

StoreOfficialRequest:
  type: object
  description: "multipart/form-data (foto wajib)."
  required: [citizen_id, position, started_at, photo]
  properties:
    citizen_id:
      type: string
      format: uuid
    user_id:
      type: string
      format: uuid
      nullable: true
    position:
      $ref: '#/OfficialPositionCode'
    village_id:
      type: string
      format: uuid
      nullable: true
    rt_id:
      type: integer
      nullable: true
    rw_id:
      type: integer
      nullable: true
    hamlet_id:
      type: integer
      nullable: true
    phone_wa:
      type: string
      maxLength: 20
      nullable: true
    started_at:
      type: string
      format: date
    term_ends_at:
      type: string
      format: date
      nullable: true
    ended_at:
      type: string
      format: date
      nullable: true
    is_active:
      type: boolean
    notes:
      type: string
      nullable: true
    photo:
      type: string
      format: binary
      description: PNG/JPG/JPEG/WebP, maks 5 MB; disimpan di disk public.

UpdateOfficialRequest:
  type: object
  description: |
    Semua field opsional (tanpa foto; ganti foto lewat POST /officials/{official}/photo).
    Pada official yang terhubung ke user, perubahan jabatan/akun dilakukan
    melalui promote, demote, atau rotate.
  properties:
    citizen_id:
      type: string
      format: uuid
    user_id:
      type: string
      format: uuid
      nullable: true
    position:
      $ref: '#/OfficialPositionCode'
    village_id:
      type: string
      format: uuid
      nullable: true
    rt_id:
      type: integer
      nullable: true
    rw_id:
      type: integer
      nullable: true
    hamlet_id:
      type: integer
      nullable: true
    phone_wa:
      type: string
      maxLength: 20
      nullable: true
    started_at:
      type: string
      format: date
    term_ends_at:
      type: string
      format: date
      nullable: true
    ended_at:
      type: string
      format: date
      nullable: true
    is_active:
      type: boolean
    notes:
      type: string
      nullable: true

PromoteOfficialRequest:
  type: object
  description: |
    multipart/form-data. Jabatan berakun → `user_id` wajib (akun warga aktif
    yang belum menjabat; role akun diubah sesuai jabatan). Jabatan tanpa
    akun → `citizen_id` wajib (warga aktif desa yang belum menjabat; role
    akun, bila ada, tidak berubah). `rt_id`/`rw_id`/`hamlet_id` wajib untuk
    jabatan rt/rw/kadus dan harus milik desa Petugas.
  required: [position, started_at, photo]
  properties:
    user_id:
      type: string
      format: uuid
      nullable: true
    citizen_id:
      type: string
      format: uuid
      nullable: true
    position:
      $ref: '#/OfficialPositionCode'
    rt_id:
      type: integer
      nullable: true
    rw_id:
      type: integer
      nullable: true
    hamlet_id:
      type: integer
      nullable: true
    started_at:
      type: string
      format: date
    term_ends_at:
      type: string
      format: date
      nullable: true
    phone_wa:
      type: string
      maxLength: 20
      nullable: true
    notes:
      type: string
      nullable: true
    photo:
      type: string
      format: binary
      description: PNG/JPG/JPEG/WebP, maks 5 MB.

RotateOfficialRequest:
  type: object
  description: |
    multipart/form-data. Pengganti mengikuti jenis jabatan lama: `user_id`
    untuk jabatan berakun, `citizen_id` untuk jabatan tanpa akun. Posisi
    dan wilayah disalin dari jabatan lama. Tidak berlaku untuk staf_sid.
  required: [started_at, photo]
  properties:
    user_id:
      type: string
      format: uuid
      nullable: true
    citizen_id:
      type: string
      format: uuid
      nullable: true
    started_at:
      type: string
      format: date
    term_ends_at:
      type: string
      format: date
      nullable: true
    phone_wa:
      type: string
      maxLength: 20
      nullable: true
    notes:
      type: string
      nullable: true
    photo:
      type: string
      format: binary

Official:
  type: object
  description: "Bentuk `OfficialResource`."
  properties:
    id:
      type: integer
      example: 5
    citizen_id:
      type: string
      format: uuid
    user_id:
      type: string
      format: uuid
      nullable: true
      description: "NULL untuk jabatan tanpa akun."
    position:
      $ref: '#/OfficialPositionCode'
    position_label:
      type: string
      nullable: true
      example: "Ketua RT"
      description: "Label enum untuk jabatan berakun (mis. Ketua RT, Ketua RW, Staf {SID_APP_NAME}), `label` jenis jabatan desa untuk sisanya."
    village_id:
      type: string
      format: uuid
      nullable: true
    rt_id:
      type: integer
      nullable: true
    rw_id:
      type: integer
      nullable: true
    hamlet_id:
      type: integer
      nullable: true
    has_signature_img:
      type: boolean
      description: "Indikator TTD jabatan (private); preview melalui endpoint terproteksi."
    stamp_img:
      type: string
      nullable: true
      description: "Kolom legacy; tidak dipakai PDF."
    photo_img:
      type: string
      nullable: true
      example: "https://sid.example.id/storage/official-photos/<village>/abc.jpg"
      description: "URL publik foto (disk public), atau null."
    phone_wa:
      type: string
      nullable: true
    started_at:
      type: string
      format: date
    ended_at:
      type: string
      format: date
      nullable: true
    term_ends_at:
      type: string
      format: date
      nullable: true
    is_active:
      type: boolean
    notes:
      type: string
      nullable: true
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time
    citizen:
      allOf:
        - $ref: '../citizens/citizens.yaml#/Citizen'
    village:
      allOf:
        - $ref: '../villages/villages.yaml#/Village'
    hamlet:
      allOf:
        - $ref: '../wilayah/wilayah.yaml#/Hamlet'
    rt:
      allOf:
        - $ref: '../wilayah/wilayah.yaml#/Rt'
    rw:
      allOf:
        - $ref: '../wilayah/wilayah.yaml#/Rw'

OfficialCandidate:
  type: object
  description: "Hasil POST /officials/candidates/lookup."
  properties:
    citizen_id:
      type: string
      format: uuid
    user_id:
      type: string
      format: uuid
      nullable: true
    name:
      type: string
    username:
      type: string
      nullable: true
    eligible:
      type: boolean
    reason:
      type: string
      nullable: true
      example: "Warga ini belum memiliki akun. Minta yang bersangkutan mendaftar lebih dulu."

OfficialPositionType:
  type: object
  description: "Jenis jabatan desa tanpa akun (dikelola Petugas Desa)."
  properties:
    id:
      type: integer
      example: 1
    code:
      type: string
      example: "kasi_kesejahteraan"
      description: "Dibuat dari label saat create; tidak dapat diubah (disimpan di officials.position)."
    label:
      type: string
      example: "Kasi Kesejahteraan"
    is_single_occupant:
      type: boolean
      example: true
    sort_order:
      type: integer
      example: 1
    is_active:
      type: boolean
      example: true

PublicOfficial:
  type: object
  description: "Perangkat desa untuk Profil Desa publik: tanpa kontak maupun identitas kependudukan."
  properties:
    id:
      type: integer
    position:
      type: string
      example: "kepala_desa"
    position_label:
      type: string
      example: "Kepala Desa"
    name:
      type: string
      nullable: true
    hamlet_id:
      type: integer
      nullable: true
    hamlet_name:
      type: string
      nullable: true
    photo_url:
      type: string
      nullable: true

RotateOfficialResponse:
  type: object
  properties:
    message:
      type: string
      example: "Rotasi jabatan berhasil diproses"
    data:
      type: object
      properties:
        old_official:
          $ref: '#/Official'
        new_official:
          $ref: '#/Official'
    warnings:
      type: array
      description: "Selalu kosong pada rotasi (pengganti langsung ditetapkan)."
      items:
        type: object
