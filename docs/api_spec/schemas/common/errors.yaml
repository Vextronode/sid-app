ValidationErrorResponse:
  type: object
  properties:
    message:
      type: string
      example: "The given data was invalid."
    errors:
      type: object
      additionalProperties:
        type: array
        items:
          type: string
      example:
        nik: ["NIK harus 16 digit angka."]
        email: ["Email sudah terdaftar."]

ErrorResponse:
  type: object
  properties:
    message:
      type: string
      example: "Surat bukan wewenang Anda."

UnauthenticatedResponse:
  type: object
  properties:
    message:
      type: string
      example: "Unauthenticated."

ForbiddenResponse:
  type: object
  properties:
    message:
      type: string
      example: "Anda tidak memiliki akses untuk aksi ini."
    code:
      type: string
      enum: [account_inactive, role_forbidden]
      description: |
        `account_inactive`: dikirim middleware account.active ketika akun pada
        sesi aktif telah dinonaktifkan. `role_forbidden`: dikirim middleware
        role ketika peran akun tidak diizinkan untuk endpoint, termasuk bila
        peran baru saja berubah (rotasi/turun jabatan); FE memeriksa ulang
        akun dan mengarahkan ke dashboard peran yang baru.
      example: "account_inactive"

NotFoundResponse:
  type: object
  properties:
    message:
      type: string
      example: "Data tidak ditemukan."

ConflictResponse:
  type: object
  properties:
    message:
      type: string
      example: "Surat sudah diproses sebelumnya."

ServerErrorResponse:
  type: object
  properties:
    message:
      type: string
      example: "Terjadi kesalahan pada server. Silakan coba lagi nanti."

PaginationMeta:
  type: object
  properties:
    current_page:
      type: integer
      example: 1
    per_page:
      type: integer
      example: 15
    total:
      type: integer
      example: 42
    last_page:
      type: integer
      example: 3

SuccessMessage:
  type: object
  properties:
    message:
      type: string
      example: "Operasi berhasil dilakukan."
