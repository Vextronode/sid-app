Village:
  type: object
  properties:
    id:
      type: integer
      example: 1
    name:
      type: string
      example: "Desa Cibenda"
    code:
      type: string
      example: "32.01.05.2003"
    head_name:
      type: string
      nullable: true
      example: "H. Ridwan Saepudin"
    address:
      type: string
      nullable: true
      example: "Jl. Raya Cibenda No. 1"
    phone:
      type: string
      nullable: true
      example: "0261-1234567"
    history:
      type: string
      nullable: true
      example: "Desa Cibenda didirikan pada tahun 1945..."
    vision:
      type: string
      nullable: true
      example: "Menjadi desa mandiri, maju, dan sejahtera"
    mission:
      type: string
      nullable: true
      example: "1. Meningkatkan pelayanan publik\n2. Mengembangkan ekonomi desa"

