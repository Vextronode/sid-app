ContactUsResponse:
  type: object
  properties:
    data:
      type: array
      items:
        type: object
        properties:
          position:
            type: string
            enum: [kasi_pelayanan, kaur_tu_umum]
            example: "kasi_pelayanan"
          name:
            type: string
            example: "Kasim"
          phone_wa:
            type: string
            example: "6281234567890"
          wa_link:
            type: string
            example: "https://wa.me/6281234567890"
