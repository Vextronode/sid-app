VillageRegulation:
  type: object
  properties:
    id:
      type: integer
      example: 3
    village_id:
      type: string
      format: uuid
      example: "0b7a9c52-3d1e-4f6a-8b2c-5e9d1a7f3c40"
    regulation_number:
      type: string
      example: "01/PERDES/2026"
    title:
      type: string
      example: "Peraturan Desa tentang Pengelolaan Sampah"
    content:
      type: string
      example: "Bab I Ketentuan Umum..."
    enacted_date:
      type: string
      format: date
      nullable: true
      example: "2026-01-15"
    created_by:
      type: string
      format: uuid
      example: "e8aaa421-7fdd-42cf-8c30-993264820afd"

VillageRegulationCreateRequest:
  type: object
  required: [regulation_number, title, content]
  properties:
    regulation_number:
      type: string
      example: "01/PERDES/2026"
    title:
      type: string
      example: "Peraturan Desa tentang Pengelolaan Sampah"
    content:
      type: string
      example: "Bab I Ketentuan Umum..."
    enacted_date:
      type: string
      format: date
      example: "2026-01-15"
