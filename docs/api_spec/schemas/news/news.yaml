News:
  type: object
  properties:
    id:
      type: integer
      example: 12
    village_id:
      type: string
      format: uuid
    author_id:
      type: string
      format: uuid
    author_name:
      type: string
      description: "Hanya bila relasi author dimuat."
    title:
      type: string
      example: "Pengumuman Jadwal Posyandu Bulan Juli"
    slug:
      type: string
    content:
      type: string
    thumbnail:
      type: string
      nullable: true
      description: "URL publik (disk public) atau null."
    categories:
      type: array
      description: "1-2 kategori berita (bentuk ringkas id, name, slug)."
      items:
        $ref: '#/NewsCategory'
    is_published:
      type: boolean
    published_at:
      type: string
      format: date-time
      nullable: true

NewsCategory:
  type: object
  properties:
    id:
      type: integer
      example: 2
    name:
      type: string
      example: "Pengumuman"
    slug:
      type: string
      example: "pengumuman"
    news_count:
      type: integer
      description: "Hanya di daftar kelola kategori; ikut menghitung berita soft-deleted."
    can_delete:
      type: boolean
      description: "Hanya di daftar kelola kategori; true bila belum pernah dipakai berita."

NewsCategoryRequest:
  type: object
  required: [name]
  properties:
    name:
      type: string
      maxLength: 50
      example: "Kesehatan"

NewsCreateRequest:
  type: object
  description: "multipart/form-data. `is_published` boleh berupa teks \"true\"/\"false\"."
  required: [title, content, category_ids]
  properties:
    title:
      type: string
      maxLength: 200
    content:
      type: string
    thumbnail:
      type: string
      format: binary
      nullable: true
      description: "Gambar maks 2048 KB."
    is_published:
      type: boolean
    category_ids:
      type: array
      minItems: 1
      maxItems: 2
      uniqueItems: true
      items:
        type: integer
      description: "ID kategori milik desa yang sama."

NewsUpdateRequest:
  type: object
  properties:
    title:
      type: string
      maxLength: 200
    content:
      type: string
    is_published:
      type: boolean
    thumbnail:
      type: string
      format: binary
      nullable: true
    category_ids:
      type: array
      minItems: 1
      maxItems: 2
      uniqueItems: true
      items:
        type: integer
      description: "Opsional; bila dikirim, kategori disinkronkan ulang."
