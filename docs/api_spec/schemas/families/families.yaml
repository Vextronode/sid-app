Family:
  type: object
  description: |
    BARU v5.0. Tabel Kartu Keluarga (KK), sengaja dibuat TIPIS - hanya
    berisi data yang benar-benar sama untuk semua anggota keluarga.
    no_kk mengikuti pola dual-column enkripsi yang sama seperti NIK
    (no_kk / no_kk_hash), karena levelnya sama sensitif dengan NIK.
  properties:
    id:
      type: string
      format: uuid
      example: "d4a7c0e3-9b26-4815-b3f7-6a2d8e1c5f09"
    village_id:
      type: string
      format: uuid
      example: "0b7a9c52-3d1e-4f6a-8b2c-5e9d1a7f3c40"
    no_kk_masked:
      type: string
      example: "************0001"
      description: No KK selalu ditampilkan ter-mask, tidak pernah plaintext di response
    family_address:
      type: string
      example: "Jl. Merdeka No. 10"
      description: "Alamat resmi sesuai dokumen KK - bisa berbeda dari citizens.address individu"
    family_status:
      type: string
      enum: [aktif, pindah, bubar]
      default: aktif
      example: "aktif"
    rt_id:
      type: integer
      nullable: true
      example: 12
    hamlet_id:
      type: integer
      nullable: true
      example: 1
    head_of_family_id:
      type: string
      format: uuid
      nullable: true
      example: "5f2d8a91-6c3b-4e7d-9a14-b8e0c2d5f731"
      description: |
        Denormalisasi OPSIONAL untuk performa query. Pada prinsipnya bisa
        diturunkan dari citizens.family_role='kepala_keluarga'. Aplikasi
        wajib menjaga konsistensi manual antara kedua sumber data ini.
    head_of_family:
      type: object
      nullable: true
      properties:
        id:
          type: string
          format: uuid
          example: "5f2d8a91-6c3b-4e7d-9a14-b8e0c2d5f731"
        name:
          type: string
          example: "Ahmad Budiman"
    members_count:
      type: integer
      example: 4
      description: "Jumlah anggota aktif dalam KK ini, dihitung dari citizens.family_id"
    rw_id:
      type: integer
      nullable: true
      example: 5
    village:
      nullable: true
      $ref: '../villages/villages.yaml#/Village'
    rt:
      nullable: true
      $ref: '../wilayah/wilayah.yaml#/Rt'
    rw:
      nullable: true
      $ref: '../wilayah/wilayah.yaml#/Rw'
    hamlet:
      nullable: true
      $ref: '../wilayah/wilayah.yaml#/Hamlet'
    created_at:
      type: string
      format: date-time
      example: "2026-06-01T08:00:00Z"
    updated_at:
      type: string
      format: date-time
      example: "2026-06-01T08:00:00Z"

FamilyCreateRequest:
  type: object
  required: [no_kk, family_address]
  properties:
    no_kk:
      type: string
      example: "3201011234560001"
      description: "16 digit, plaintext hanya di request, langsung dienkripsi AES-256 di server"
    family_address:
      type: string
      example: "Jl. Merdeka No. 10"
    family_status:
      type: string
      enum: [aktif, pindah, bubar]
      example: "aktif"
    rt_id:
      type: integer
      nullable: true
      example: 12
    rw_id:
      type: integer
      nullable: true
      example: 5
    hamlet_id:
      type: integer
      nullable: true
      example: 1

FamilyUpdateRequest:
  type: object
  properties:
    family_address:
      type: string
      example: "Jl. Merdeka No. 10"
    family_status:
      type: string
      enum: [aktif, pindah, bubar]
      example: "pindah"
    rt_id:
      type: integer
      nullable: true
      example: 12
    rw_id:
      type: integer
      nullable: true
      example: 5
    hamlet_id:
      type: integer
      nullable: true
      example: 1

FamilyMemberAddRequest:
  type: object
  required: [citizen_id, family_role]
  description: |
    Menautkan warga (sudah ada di citizens) ke KK ini. Sistem otomatis
    validasi hanya 1 family_role='kepala_keluarga' per family_id aktif.
  properties:
    citizen_id:
      type: string
      format: uuid
      example: "e3b6a9c4-2d58-4f71-a0c3-9d1e7b5a2f84"
    family_role:
      type: string
      enum: [kepala_keluarga, istri, suami, anak, famili_lain]
      example: "anak"

FamilySocioeconomic:
  type: object
  description: Data survei sosio-ekonomi per KK; satu baris opsional untuk setiap keluarga.
  properties:
    id:
      type: integer
      example: 1
    family_id:
      type: string
      format: uuid
      example: "d4a7c0e3-9b26-4815-b3f7-6a2d8e1c5f09"
    household_income_range:
      type: string
      enum: ["<1jt", "1-3jt", "3-5jt", "5-10jt", ">10jt"]
      nullable: true
      example: "3-5jt"
      description: Penghasilan rumah tangga; definisi periode belum ditetapkan.
    house_ownership_status:
      type: string
      enum: [milik_sendiri, sewa, menumpang, dinas]
      nullable: true
      example: "milik_sendiri"
    water_source:
      type: string
      enum: [pdam, sumur, sungai, lainnya]
      nullable: true
      example: "pdam"
    electricity_source:
      type: string
      enum: [pln, non_pln, tidak_ada]
      nullable: true
      example: "pln"
    dependents_count:
      type: integer
      nullable: true
      example: 3
    productive_assets:
      type: object
      nullable: true
      additionalProperties: true
      example: {"kendaraan": "motor", "ternak": null}
    surveyed_at:
      type: string
      format: date-time
      nullable: true
      example: "2026-05-01T09:00:00Z"
    surveyed_by:
      type: string
      format: uuid
      nullable: true
      example: "e8aaa421-7fdd-42cf-8c30-993264820afd"

FamilySocioeconomicUpsertRequest:
  type: object
  properties:
    household_income_range:
      type: string
      enum: ["<1jt", "1-3jt", "3-5jt", "5-10jt", ">10jt"]
      example: "3-5jt"
      description: Penghasilan rumah tangga; definisi periode belum ditetapkan.
    house_ownership_status:
      type: string
      enum: [milik_sendiri, sewa, menumpang, dinas]
      example: "milik_sendiri"
    water_source:
      type: string
      enum: [pdam, sumur, sungai, lainnya]
      example: "pdam"
    electricity_source:
      type: string
      enum: [pln, non_pln, tidak_ada]
      example: "pln"
    dependents_count:
      type: integer
      example: 3
    productive_assets:
      type: object
      additionalProperties: true
      example: {"kendaraan": "motor"}
