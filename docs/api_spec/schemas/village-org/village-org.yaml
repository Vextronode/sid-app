VillageOrgPosition:
  type: object
  properties:
    id:
      type: integer
      example: 1
    village_id:
      type: string
      format: uuid
      example: "0b7a9c52-3d1e-4f6a-8b2c-5e9d1a7f3c40"
    org_type:
      type: string
      enum: [bpd, bumdes, lpm, karang_taruna, pkk]
      example: "bpd"
    slot:
      type: string
      enum: [ketua, wakil_ketua, anggota]
      example: "ketua"
    position_label:
      type: string
      example: "Ketua"
    is_single_occupant:
      type: boolean
      description: true untuk ketua dan wakil_ketua, false untuk anggota
      example: true
    sort_order:
      type: integer
      example: 0
    is_active:
      type: boolean
      example: true
    members:
      type: array
      items:
        $ref: '#/VillageOrgMember'

VillageOrgMember:
  type: object
  properties:
    id:
      type: integer
      example: 1
    position_id:
      type: integer
      example: 1
    member_name:
      type: string
      example: "Budi Santoso"
    photo_img:
      type: string
      nullable: true
      description: URL publik foto profil; diatur lewat endpoint .../members/{id}/photo.
      example: "http://localhost:8000/storage/org-member-photos/0b7a9c52/ketua.webp"
    phone_wa:
      type: string
      nullable: true
      example: "6281111222333"
    started_at:
      type: string
      format: date
      example: "2024-01-01"
    ended_at:
      type: string
      format: date
      nullable: true
      example: null
    is_active:
      type: boolean
      example: true
    notes:
      type: string
      nullable: true
      example: null

VillageOrgMemberCreateRequest:
  type: object
  required: [started_at]
  properties:
    member_name:
      type: string
      description: Wajib bila from_member_id tidak diisi.
      example: "Budi Santoso"
    from_member_id:
      type: integer
      nullable: true
      description: |
        Promosi anggota/wakil aktif organisasi yang sama ke slot ini.
        Jabatan lamanya diakhiri dan datanya disalin.
      example: null
    previous_holder:
      type: string
      enum: [end, to_member]
      description: |
        Nasib pemegang lama slot ketua/wakil_ketua: `end` (default, masuk
        riwayat) atau `to_member` (dicatat sebagai Anggota aktif).
      example: "end"
    phone_wa:
      type: string
      example: "6281111222333"
    started_at:
      type: string
      format: date
      example: "2024-01-01"
    notes:
      type: string
      nullable: true
      example: null
