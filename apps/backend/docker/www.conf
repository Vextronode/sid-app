; Override pool [www] untuk image sid-api.
; Dipasang sebagai php-fpm.d/zz-sid-www.conf sehingga dimuat SETELAH docker.conf,
; www.conf, dan zz-docker.conf bawaan image resmi. `listen = 9000` dan
; `clear_env = no` bawaan image sengaja tidak ditimpa.

[www]
pm = dynamic
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
pm.max_requests = 500

; Healthcheck lewat cgi-fcgi (lihat HEALTHCHECK di Dockerfile).
ping.path = /ping
ping.response = pong

; Batas keras per request (di atas max_execution_time PHP).
request_terminate_timeout = 150s

; Access log FPM dimatikan: Nginx sudah mencatat request, dan ping healthcheck
; tiap beberapa detik hanya menambah kebisingan.
access.log = /dev/null
