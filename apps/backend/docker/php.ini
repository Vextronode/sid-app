; Override produksi untuk image sid-api (dimuat setelah php.ini-production).

expose_php = Off
memory_limit = 256M

; Upload: file terbesar 10 MB (impor warga); lampiran surat 2 MB per file.
upload_max_filesize = 10M
post_max_size = 24M
max_file_uploads = 20

; Render PDF (dompdf) bisa lambat pada request pertama (cache font).
max_execution_time = 120
max_input_time = 120

date.timezone = Asia/Jakarta

display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

realpath_cache_size = 4096K
realpath_cache_ttl = 600

; Kode di image tidak pernah berubah: tidak perlu cek timestamp.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.save_comments = 1
